/* 테마 공통 적용 지점 */
.lk-time,.ap-hd h1,.widget h3,.nt b,.sh-title,.hero h2,.res h2,.sec-h2,.calhd h1,#toast b,.vs-side b{font-family:var(--disp,var(--font))}
.pv-clock{font-family:var(--disp,var(--font))}
.arena{background-image:var(--arena),linear-gradient(180deg,rgba(255,69,58,.08),rgba(255,255,255,.015) 42%,rgba(255,255,255,.015) 58%,color-mix(in srgb,var(--acc) 8%,transparent))}
/* 흑월 레드 */
:root[data-theme=moon] .lk-time{color:#ffc2b8;text-shadow:0 0 28px rgba(255,69,58,.65);letter-spacing:0}
.thm .pv[data-theme=moon] .pv-clock{color:#ffc2b8;text-shadow:0 0 28px rgba(255,69,58,.65);letter-spacing:0}
:root[data-theme=moon] .appi .ic{background:#140607!important;color:#ff6b5e!important;box-shadow:inset 0 0 0 1.5px rgba(255,107,94,.55),0 6px 16px rgba(0,0,0,.55)}
.thm .pv[data-theme=moon] .pvi{background:#140607!important;color:#ff6b5e!important;box-shadow:inset 0 0 0 1.5px rgba(255,107,94,.55),0 6px 16px rgba(0,0,0,.55)}
:root[data-theme=moon] .appi .ic.cal{background:#140607!important;color:#ffd8d2!important}
:root[data-theme=moon] .widget{background:rgba(20,6,7,.62);box-shadow:inset 0 0 0 1px rgba(255,107,94,.35)}
:root[data-theme=moon] .notif{box-shadow:inset 0 0 0 1px rgba(255,107,94,.3),0 12px 32px rgba(0,0,0,.45)}
/* 가이드 퍼플 */
:root[data-theme=guide] .lk-time{background:linear-gradient(90deg,#b9a2ff,#ff9bd0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
.thm .pv[data-theme=guide] .pv-clock{background:linear-gradient(90deg,#b9a2ff,#ff9bd0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
:root[data-theme=guide] .appi .ic{background:rgba(255,255,255,.13)!important;color:#fff!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 8px 20px rgba(60,20,120,.45)}
.thm .pv[data-theme=guide] .pvi{background:rgba(255,255,255,.13)!important;color:#fff!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 8px 20px rgba(60,20,120,.45)}
:root[data-theme=guide] .appi .ic.cal{color:#fff!important}
:root[data-theme=guide] .appi .ic.cal small{color:#ff9bd0}
:root[data-theme=guide] .widget{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
/* S급 골드 */
:root[data-theme=gold] .lk-time{color:#ffe08a;font-weight:800;letter-spacing:4px;text-shadow:0 2px 0 #6b4f08}
.thm .pv[data-theme=gold] .pv-clock{color:#ffe08a;font-weight:800;letter-spacing:4px;text-shadow:0 2px 0 #6b4f08}
:root[data-theme=gold] .lk-date{font-family:'Nanum Myeongjo',serif;letter-spacing:2px;color:#e8cf86}
:root[data-theme=gold] .appi .ic{background:linear-gradient(150deg,#1f190a,#0a0804)!important;color:#ffd60a!important;box-shadow:inset 0 0 0 1.5px rgba(255,214,10,.65),inset 0 0 0 4px #0a0804,inset 0 0 0 5px rgba(255,214,10,.25),0 6px 16px rgba(0,0,0,.55);border-radius:12px!important}
.thm .pv[data-theme=gold] .pvi{background:linear-gradient(150deg,#1f190a,#0a0804)!important;color:#ffd60a!important;box-shadow:inset 0 0 0 1.5px rgba(255,214,10,.65),inset 0 0 0 4px #0a0804,inset 0 0 0 5px rgba(255,214,10,.25),0 6px 16px rgba(0,0,0,.55);border-radius:12px!important}
:root[data-theme=gold] .appi .ic.cal{color:#ffe08a!important}
:root[data-theme=gold] .appi .ic.cal small{color:#ffd60a}
:root[data-theme=gold] .widget{background:rgba(12,10,4,.7);box-shadow:inset 0 0 0 1px rgba(255,214,10,.45),inset 0 0 0 5px rgba(12,10,4,.7),inset 0 0 0 6px rgba(255,214,10,.2)}
:root[data-theme=gold] .unit{box-shadow:inset 0 0 0 1px rgba(255,214,10,.22)}
/* 가드 그린 */
:root[data-theme=guard] .lk-time{color:#8be08b;font-weight:700;letter-spacing:-2px;text-shadow:0 0 18px rgba(61,220,106,.45)}
.thm .pv[data-theme=guard] .pv-clock{color:#8be08b;font-weight:700;letter-spacing:-2px;text-shadow:0 0 18px rgba(61,220,106,.45)}
:root[data-theme=guard] .lk-time i{animation:blink 1s steps(1) infinite}
:root[data-theme=guard] .appi .ic{background:#122417!important;color:#8be08b!important;border-radius:10px!important;box-shadow:inset 0 0 0 1.5px rgba(139,224,139,.5),0 6px 14px rgba(0,0,0,.5)}
.thm .pv[data-theme=guard] .pvi{background:#122417!important;color:#8be08b!important;border-radius:10px!important;box-shadow:inset 0 0 0 1.5px rgba(139,224,139,.5),0 6px 14px rgba(0,0,0,.5)}
:root[data-theme=guard] .appi .ic.cal{color:#d8f5d8!important}
:root[data-theme=guard] .appi span{font-family:'Nanum Gothic Coding',monospace}

let AC=null;
function tone(f,d,type,v,when,slide){const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.06,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v){const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start()}

  if(!SAVE.sound)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    switch(k){

      case 'alarm':tone(660,.14,'square',.035);tone(520,.14,'square',.035,.16);tone(660,.14,'square',.035,.32);break;

const strainOf=u=>u.card.type==='G'?0:Math.max(0,strainBase(u)+(perk(u.key).strain||0));
const strainBase=u=>u.card.type==='G'?0:u.guide&&CARDS[u.guide].gab==='steady'?Math.ceil(STRAIN[u.card.grade]/2):STRAIN[u.card.grade];
function atkOf(u){const pk=(perk(u.key).atk||0)+awakeAtk(u.key,u.card.type)+wxMod(u);if(u.card.type==='G')return Math.max(0,u.card.atk+u.atkMod+u.tmp+pk);let a=u.card.atk+u.atkMod+u.tmp+pk;if(u.guide&&matchOf(u)>=85)a+=300;if(u.bonded)a+=500;if(u.berserk)a=Math.round(a*1.3);return Math.max(0,a)}
function mkUnit(key){const c=CARDS[key];return{uid:nid(),key,card:c,inst:c.type==='G'?0:START_INST[c.grade],atkMod:0,tmp:0,guide:null,bonded:false,attacked:false,summonRound:G.round,berserk:false,fresh:true}}

/* ───────────── 전투 규칙 ───────────── */
function draw(side,n,src,quiet){
  const P=G[side];
  for(let i=0;i<n;i++){
    if(!P.deck.length){dmg(side,500);log(side,`${side==='me'?'센터':'흑월'} 보급고 고갈! 본부 <em>-500</em>`);if(G.inBattle&&checkEnd())break;continue}
    const key=P.deck.pop();
    if(P.hand.length>=9){log(side,`수납 초과로 ${CARDS[key].name} 반납`);continue}
    P.hand.push({hid:nid(),key,fresh:side==='me'});
    if(side==='me'&&!quiet)notify(src||'센터 보급 도착',`<b>${CARDS[key].name}</b> (${typeName(CARDS[key])}) 지급 완료`);
  }
}
function dmg(side,n){G[side].lp=Math.max(0,G[side].lp-n);if(side==='ai')G.stats.dealt+=n;if(side==='me'&&G.me.lp>0&&G.me.lp<1500&&!G.lowWarned){G.lowWarned=true;msgTrigger('lowlp',{},1)}G.fx.push({sel:'#lp-'+side,text:'-'+n,cls:'fl-dmg'+(n>=1000?' big':''),side})}
function ufx(u,text,cls,anim){G.fx.push({sel:`[data-uid="${u.uid}"]`,text,cls,anim})}
function addInst(u,n,side){
  if(u.card.type==='G')return;
  u.inst=Math.max(0,Math.min(100,u.inst+n));
  if(u.inst>=100&&!u.berserk){
    u.berserk=true;speak(u,'berserk',true);if(side==='me'){G.stats.berserk++;msgTrigger('berserk',{name:u.card.name,actor:messageActor(u.key),uid:u.uid},1)}sfx('alarm');
    log(side,`<b class="r">⚠ ${u.card.name} 폭주!</b> 통제 불능`);
    if(side==='me')notify('경보: 센티넬 폭주',`<b>${u.card.name}</b> 불안정도 100 도달. 즉시 가이딩이 필요합니다.`,'alert');
    else notify('적 센티넬 폭주 감지',`${u.card.name}이(가) 통제를 벗어났습니다.`,'enemy');
  }else if(u.berserk&&u.inst<70){
    u.berserk=false;if(side==='me')msgTrigger('recover',{name:u.card.name,actor:messageActor(u.key),uid:u.uid},1);log(side,`${u.card.name} 폭주 진정`);
    if(side==='me')notify('폭주 진정',`<b>${u.card.name}</b>의 파장이 안정권으로 돌아왔습니다.`);
  }
}
function kill(side,u){speak(u,'down',true,0);
  const i=G[side].field.indexOf(u);if(i<0)return;G[side].field[i]=null;if(side==='ai'){G.stats.kills++;msgTrigger('kill',{target:u.card.name,uid:u.uid,actor:messageActor(G.msgAttacker)},1)}sfx('destroy');
  log(side,`${u.card.name} 전투 불능 — ${side==='me'?'센터 의료동 후송':'제압 완료'}${u.guide?` (가이드 ${CARDS[u.guide].name} 동반 이탈)`:''}`);
}
function validTargets(side,c){
  const own=G[side].field.filter(Boolean),en=G[opp(side)].field.filter(Boolean);
  switch(c.tgt){case 'own':return own;case 'ownS':return own.filter(u=>u.card.type==='S');case 'ownNoGuide':return own.filter(u=>u.card.type==='S'&&!u.guide);case 'ownPaired':return own.filter(u=>u.guide&&!u.bonded);case 'enemy':return en;default:return[]}
}
function onSummon(side,u){
  const P=G[side],E=G[opp(side)];
  switch(u.card.ab){
    case 'scout':draw(side,1,'정찰 보고 수신');log(side,`${u.card.name} 정찰 — 카드 1장`);break;
    case 'relay':P.sp+=1;log(side,`${u.card.name} 통신 중계 — SP +1`);break;
    case 'weaken':{const t=E.field.filter(Boolean).sort((a,b)=>atkOf(b)-atkOf(a))[0];if(t){t.atkMod-=300;ufx(t,'ATK -300','fl-dmg','hit');log(side,`${u.card.name} 염동 압박 → ${t.card.name} ATK -300`)}break}
    case 'gravity':E.field.filter(Boolean).forEach(t=>{t.atkMod-=200;ufx(t,'ATK -200','fl-dmg','hit')});log(side,`${u.card.name} 중력장 — 상대 전원 ATK -200`);break;
    case 'calm':P.field.filter(x=>x&&x.card.type==='S').forEach(t=>{const cv=15+(perk(u.key).calm||0);addInst(t,-cv,side);ufx(t,'-'+cv,'fl-heal')});log(side,`${u.card.name} 수류 진정 — 아군 불안정도 -${15+(perk(u.key).calm||0)}`);break;
    case 'blink':u.summonRound=G.round-1;log(side,`${u.card.name} 순간이동 — 즉시 공격 가능`);break;
    case 'flash':{const t=E.field.filter(x=>x&&atkOf(x)<=1300).sort((a,b)=>atkOf(b)-atkOf(a))[0];if(t){ufx(t,'제압','fl-dmg','hit');log(side,`${u.card.name} 섬광 — ${t.card.name} 제압`);kill(opp(side),t)}break}
    case 'barrier':P.lp+=500;P.maxLp=Math.max(P.maxLp,P.lp);G.fx.push({sel:'#lp-'+side,text:'+500',cls:'fl-heal'});log(side,`${u.card.name} 결계 — 본부 +500`);break;
    case 'rally':P.field.filter(x=>x&&x!==u&&x.card.type==='S').forEach(t=>{t.atkMod+=100;ufx(t,'ATK +100','fl-gold')});log(side,`${u.card.name} 공명 — 아군 ATK +100`);break;
    case 'chill':E.field.filter(Boolean).forEach(t=>{addInst(t,20,opp(side));ufx(t,'불안정 +20','fl-warn','hit')});log(side,`${u.card.name} 파장 압박 — 상대 전원 불안정 +20`);break;
  }
}
function playCard(side,hi,t,asField){
  const P=G[side],h=P.hand[hi];if(!h)return false;const c=CARDS[h.key];
  if(P.sp<c.cost)return false;
  if(c.type==='S'){
    const slot=P.field.indexOf(null);if(slot<0)return false;
    P.sp-=c.cost;P.hand.splice(hi,1);
    const u=mkUnit(h.key);P.field[slot]=u;if(side==='me')opsOnDeploy(u);
    log(side,`<b>${c.name}</b>(${c.grade}급 ${c.elem}) 현장 배치`);
    onSummon(side,u);speak(u,'deploy');if(side==='me')msgTrigger('deploy',{actor:messageActor(u.key),name:c.name,uid:u.uid},1);
  }else if(c.type==='G'&&asField){
    const slot=P.field.indexOf(null);if(slot<0)return false;
    P.sp-=c.cost;P.hand.splice(hi,1);
    P.field[slot]=mkUnit(h.key);if(side==='me')opsOnDeploy(P.field[slot]);if(side==='me')msgTrigger('fieldguide',{actor:messageActor(h.key),name:c.name,uid:P.field[slot].uid},1);
    log(side,`가이드 <b>${c.name}</b> 현장 투입 (ATK ${c.atk})`);
  }else if(c.type==='G'){
    if(!t||t.guide)return false;
    P.sp-=c.cost;P.hand.splice(hi,1);
    t.guide=h.key;guideAbility(side,t,c);const m=matchOf(t);
    ufx(t,`매칭 ${m}%`,m>=85?'fl-gold':'fl-heal','hit');
    log(side,`가이드 <b>${c.name}</b> ↔ ${t.card.name} 매칭 <span class="${m>=85?'g':''}">${m}%</span>`);if(side==='me')msgTrigger('pair',messagePairContext(t),1);
    if(side==='me')notify(m>=85?'고매칭 가이드 배정':'가이드 배정',`${c.name} → ${t.card.name} · 매칭률 <b>${m}%</b>${m>=85?' · ATK +300':''}`,m>=85?'bond':'center');
  }else{
    if(c.tgt!=='none'&&!t)return false;
    P.sp-=c.cost;P.hand.splice(hi,1);
    const O=opp(side);
    switch(h.key){
      case 'i_stab':addInst(t,-30,side);ufx(t,'불안정 -30','fl-heal');break;
      case 'i_amp':addInst(t,-60,side);ufx(t,'불안정 -60','fl-heal');break;
      case 'i_noise':P.field.filter(Boolean).forEach(u=>{addInst(u,-35,side);ufx(u,'-35','fl-heal')});break;

async function doAttack(side,a,d){

    else{log(side,`<b>${a.card.name}</b>(${aa}) ▶ ${d.card.name}(${dd}) 반격당함 <em>-${dd-aa}</em>`);kill(side,a);dmg(side,dd-aa);addInst(d,10,O);ufx(d,'불안정 +10','fl-warn')}

async function berserkAct(side,u){

async function startTurn(side){

async function endTurn(side){

function checkEnd(){

/* ───────────── 흑월 AI ───────────── */
function aiPickItem(){
  const P=G.ai,own=P.field.filter(Boolean),foes=G.me.field.filter(Boolean);
  for(const [i,h] of P.hand.entries()){
    const c=CARDS[h.key];if(c.type!=='I'||c.cost>P.sp)continue;
    switch(h.key){
      case 'i_stab':{const t=own.filter(u=>u.inst>=55).sort((a,b)=>b.inst-a.inst)[0];if(t)return{i,t};break}
      case 'i_amp':{const t=own.filter(u=>u.inst>=70).sort((a,b)=>b.inst-a.inst)[0];if(t)return{i,t};break}
      case 'i_noise':if(own.reduce((s,u)=>s+u.inst,0)>=120)return{i};break;
      case 'i_snipe':{const t=foes.slice().sort((a,b)=>atkOf(b)-atkOf(a))[0];if(t&&atkOf(t)>=1400)return{i,t};break}
      case 'i_bond':{const t=own.find(u=>u.guide&&!u.bonded);if(t)return{i,t};break}
      case 'i_boost':{const t=own.find(u=>canAttack('ai',u)&&u.inst<=50&&!u.tmp&&foes.some(f=>atkOf(f)>=atkOf(u)&&atkOf(f)<atkOf(u)+500));if(t)return{i,t};break}
      case 'i_extra':if(P.hand.length<=3)return{i};break;
      case 'i_orbital':return{i};
      case 'i_coffee':if(own.reduce((s,u)=>s+u.inst,0)>=60||P.hand.length<=3)return{i};break;
      case 'i_ration':if(P.lp<=P.maxLp-600)return{i};break;
    }
  }
  return null;
}
async function aiTurn(){
  const g=G,P=G.ai;
  if(!await wait(900,g))return;
  // 1. 센티넬 배치
  for(let k=0;k<3;k++){
    const hs=P.hand.map((h,i)=>({i,c:CARDS[h.key]})).filter(x=>x.c.type==='S'&&x.c.cost<=P.sp).sort((a,b)=>b.c.cost-a.c.cost);
    if(!hs.length||!P.field.includes(null))break;
    playCard('ai',hs[0].i);render();if(!await wait(700,g))return;
  }
  // 2. 가이드 매칭
  for(let k=0;k<3;k++){
    const gs=P.hand.map((h,i)=>({i,key:h.key,c:CARDS[h.key]})).filter(x=>x.c.type==='G'&&x.c.cost<=P.sp).sort((a,b)=>b.c.power-a.c.power);
    const cands=P.field.filter(u=>u&&u.card.type==='S'&&!u.guide);
    if(!gs.length||!cands.length)break;
    const x=gs[0];cands.sort((a,b)=>(matchRate(b.key,x.key)-matchRate(a.key,x.key))||(b.inst-a.inst));
    playCard('ai',x.i,cands[0]);render();if(!await wait(700,g))return;
  }
  // 2-b. 매칭할 센티넬이 없으면 가이드 현장 투입
  for(let k=0;k<3;k++){
    if(!P.field.includes(null)||P.field.some(u=>u&&u.card.type==='S'&&!u.guide))break;
    const gs=P.hand.map((h,i)=>({i,c:CARDS[h.key]})).filter(x=>x.c.type==='G'&&x.c.cost<=P.sp).sort((a,b)=>b.c.atk-a.c.atk);
    if(!gs.length)break;
    playCard('ai',gs[0].i,null,true);render();if(!await wait(700,g))return;
  }
  // 3. 보급품
  for(let k=0;k<6;k++){const ch=aiPickItem();if(!ch)break;playCard('ai',ch.i,ch.t);render();if(!await wait(750,g))return}
  // 4. 공격
  const units=P.field.filter(u=>u&&canAttack('ai',u)).sort((a,b)=>atkOf(b)-atkOf(a));
  for(const u of units){
    if(!onField('ai',u)||!canAttack('ai',u))continue;
    let foes=G.me.field.filter(Boolean);const gd=foes.filter(f=>f.card.ab==='guard');if(gd.length)foes=gd;const a=atkOf(u);let t=null;
    if(foes.length){const k=foes.filter(f=>atkOf(f)<a).sort((x,y)=>atkOf(y)-atkOf(x));if(!k.length)continue;t=k[0]}
    const lethal=!t&&a>=G.me.lp;
    if(u.inst+STRAIN[u.card.grade]>=100&&!lethal)continue;
    await doAttack('ai',u,t);if(!await wait(450,g))return;
  }
  // 5. 추가 지원
  if(P.sp>=2&&!P.supportUsed&&P.hand.length<=3){P.sp-=2;P.supportUsed=true;draw('ai',1);log('ai','흑월 — 암시장 물자 조달 (카드 1장)');render();if(!await wait(500,g))return}
  if(g!==G||G.over)return;
  await endTurn('ai');
}

function fieldClick(e){
  const el=e.target.closest('.unit');if(!el||!G)return;
  const [side,u]=findUnit(+el.dataset.uid);if(!u)return;
  if(G.mode){
    if(G.busy)return;
    if(!G.mode.valid.includes(u.uid)){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');return}
    const m=G.mode;G.mode=null;
    if(m.kind==='attack'){const[,att]=findUnit(m.uid);if(att)doAttack('me',att,u)}
    else if(m.kind==='gmatch'){const[,gu]=findUnit(m.uid);if(gu)matchFieldGuide('me',gu,u);render()}

let WX=null,WXt=0;
const WMO=c=>c===0?['맑음','☀️','🌙']:c<=2?['구름 조금','🌤️','☁️']:c===3?['흐림','☁️','☁️']:c<=48?['안개','🌫️','🌫️']:c<=57?['이슬비','🌦️','🌧️']:c<=67?['비','🌧️','🌧️']:c<=77?['눈','🌨️','🌨️']:c<=82?['소나기','🌦️','🌧️']:c<=86?['눈','❄️','❄️']:['뇌우','⛈️','⛈️'];
async function fetchWx(){
  const url='https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=7';
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),3500);
  try{
    const r=await fetch(url,{signal:ac.signal});clearTimeout(to);if(!r.ok)throw 0;const j=await r.json();
    const now=seoulNow(),cur=`${ymd(now)}T${String(now.getHours()).padStart(2,'0')}:00`;let hi=j.hourly.time.indexOf(cur);if(hi<0)hi=0;
    const hours=[];for(let i=hi;i<hi+12&&i<j.hourly.time.length;i++)hours.push({h:+j.hourly.time[i].slice(11,13),t:Math.round(j.hourly.temperature_2m[i]),code:j.hourly.weather_code[i]});
    const days=j.daily.time.map((t,i)=>{const[a,b,c]=t.split('-').map(Number);return{d:new Date(a,b-1,c),hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i]),code:j.daily.weather_code[i]}});
    const c=j.current;
    return{src:'live',cur:{t:Math.round(c.temperature_2m),feel:Math.round(c.apparent_temperature),hum:Math.round(c.relative_humidity_2m),wind:+(c.wind_speed_10m/3.6).toFixed(1),code:c.weather_code},hours,days};
  }catch(e){clearTimeout(to);return simWx()}
}
function simWx(){
  const N=[[2,-6],[5,-4],[11,1],[18,7],[24,13],[28,18],[29,22],[30,23],[26,18],[20,10],[12,3],[4,-4]];
  const rnd=s=>{const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x)};
  const key=d=>d.getFullYear()*1000+d.getMonth()*40+d.getDate();
  const day=d=>{const[h,l]=N[d.getMonth()],k=key(d),off=(rnd(k)-.5)*6,r=rnd(k+.37),cold=l+off<1;
    const code=r<.42?0:r<.62?2:r<.8?3:r<.92?(cold?71:61):45;
    return{d:new Date(d.getFullYear(),d.getMonth(),d.getDate()),hi:Math.round(h+off-(code>=61?2:0)),lo:Math.round(l+off),code}};
  const tAt=(d,h)=>{const x=day(d),f=(Math.cos((h-15)/24*2*Math.PI)+1)/2;return Math.round(x.lo+(x.hi-x.lo)*f+(rnd(key(d)*24+h)-.5))};
  const now=seoulNow(),today=day(now),hours=[],days=[];
  for(let i=0;i<12;i++){const t=new Date(now.getTime()+i*3600000);hours.push({h:t.getHours(),t:tAt(t,t.getHours()),code:day(t).code})}
  for(let i=0;i<7;i++)days.push(day(new Date(now.getFullYear(),now.getMonth(),now.getDate()+i)));
  const ct=tAt(now,now.getHours()),wind=+(1+rnd(key(now)+.9)*4).toFixed(1);
  return{src:'sim',cur:{t:ct,feel:Math.round(ct-wind*.8),hum:Math.round(40+rnd(key(now)+.5)*40),wind,code:today.code},hours,days};
}

function messageEventValid(e){

function messageEligible(v,ctx={},manual=false){

  if(v.legacy&&!['morning','night','ms'].includes(v.on))return false;
  if(v.minAff&&(SAVE.aff[v.c]||0)<v.minAff)return false;
  if(v.needReplies&&(m.replies[v.c]||0)<v.needReplies)return false;
  if(v.mission&&v.mission!==(ctx.missionId||(G&&G.mission.id)))return false;
  if(!manual&&m.sent[v.c]!=null&&m.clock-m.sent[v.c]<(MSG_PACE[SAVE.msgPace]||MSG_PACE.slow).charGap)return false;

    if(v.arc.chapter!==a.done+1||SAVE.wins+SAVE.losses<v.arc.chapter-1)return false;
    if(v.c!=='kain'&&(SAVE.aff[v.c]||0)<Math.max(0,v.arc.chapter-2))return false;
  }
  if(v.on==='ms'&&((SAVE.aff[v.c]||0)<6||!CHARS[v.c].aff))return false;
  if(v.on==='brief'&&!(SAVE.stars[v.requiresMission]>0))return false;
  if(v.require&&!(v.require==='streak'?ctx.winStreak>=3:v.require==='losses'?ctx.loseStreak>=2:ctx.first))return false;
  if(v.reactive){
    if(!ctx.battleId)return false;

    if(['pair','bond'].includes(v.on)&&v.c!=='kain'&&!(ctx.actors||[]).includes(v.c))return false;

}

  {const iv=Object.keys(CHARS).map(c=>CHARS[c].card&&isOwned(CHARS[c].card)&&joinReady(c)&&CONV_BY_ID['intro-'+c]).find(x=>x&&!SAVE.seen[x.id]&&!SAVE.pend[x.c]);if(iv&&deliver(iv,{},false))return}

function applyOps(){
  const L=SAVE.nextOps||[];G.ops=L;G.opsCard={};G.opsAll={inst:0,atk:0};G.opsWave={};SAVE.nextOps=[];
  let sp=0,lp=0,dr=0,pw={};

    if(e.all){G.opsAll.inst+=e.inst||0;G.opsAll.atk+=e.atk||0}
    if(e.wave){const o=G.opsWave[e.wave]=G.opsWave[e.wave]||{inst:0,atk:0};o.inst+=e.inst||0;o.atk+=e.atk||0}
  }

const ALBUM_KINDS={photo:'사진',voice:'음성',sticker:'스티커',gift:'선물'};
const albumKey=me=>me.k==='photo'?'p:'+me.e+(me.bg||''):me.k==='voice'?'v:'+(me.t||me.dur):me.k==='sticker'?'s:'+me.e:'g:'+me.card;
let ALBUM_ALL=null;
function albumAll(){
  if(ALBUM_ALL)return ALBUM_ALL;const seen={};
  const walk=(x,c)=>{if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(y=>walk(y,c));return}
    if(x.k&&ALBUM_KINDS[x.k]){const key=albumKey(x);if(!seen[key])seen[key]={k:x.k,key,c:x.f||c}}
    for(const v of Object.values(x))if(v&&typeof v==='object')walk(v,x.c||c)};
  CONVS.forEach(v=>walk(v,v.c));
  return ALBUM_ALL=Object.values(seen);
}
function albumOwned(){
  const got={},list=[];
  for(const c of Object.keys(SAVE.chats||{}))for(const m of SAVE.chats[c]){const me=m[2];if(me&&me.k&&ALBUM_KINDS[me.k]){const key=albumKey({...me,t:me.k==='voice'?m[1]:me.t});if(!got[key]){got[key]=1;list.push({k:me.k,key,c:me.f&&CHARS[me.f]?me.f:c,t:m[1],me})}}}
  return{list,total:list.length};
}

function deckStats(d){

  return{n,s,g,i,avg:n?(cost/n).toFixed(1):0,wv};
}

// ── 작전실 마작 · 리치 마작 규칙 (136장 · 아카도라 3장 · 동풍전)
const HONOR=['東','南','西','北','白','發','中'];
const K=id=>id>>2,isRed=id=>id===16||id===52||id===88;
const tSuit=k=>k<9?0:k<18?1:k<27?2:3,tNum=k=>k%9+1;

function tileHTML(k,cls='',red=false){
  if(k>=27)return `<div class="tl hn ${k>=31?'dr d'+(k-31):''} ${cls}"><b>${HONOR[k-27]}</b></div>`;
  const s=tSuit(k);return `<div class="tl s${s} ${red?'red':''} ${cls}"><b>${tNum(k)}</b><i>${['萬','●','竹'][s]}</i></div>`;
}
const tid=(id,cls='')=>tileHTML(K(id),cls,isRed(id));
const cnt34=ids=>{const c=Array(34).fill(0);for(const id of ids)c[K(id)]++;return c};
const sortIds=a=>a.sort((x,y)=>K(x)-K(y)||x-y);
// 샹텐
function shStd(c,mn){
  let best=8;

    if(c[i]>=3){c[i]-=3;rec(i,m+1,t,p);c[i]+=3}
    if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;rec(i,m+1,t,p);c[i]++;c[i+1]++;c[i+2]++}
    if(c[i]>=2){c[i]-=2;if(!p)rec(i,m,t,1);rec(i,m,t+1,p);c[i]+=2}
    if(i<27&&i%9<=7&&c[i+1]){c[i]--;c[i+1]--;rec(i,m,t+1,p);c[i]++;c[i+1]++}
    if(i<27&&i%9<=6&&c[i+2]){c[i]--;c[i+2]--;rec(i,m,t+1,p);c[i]++;c[i+2]++}
    const v=c[i];c[i]=0;rec(i+1,m,t,p);c[i]=v;

}
const TERMS=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function shanten(c,mn){
  let s=shStd(c,mn);if(mn)return s;
  let pr=0,kd=0;for(const v of c){if(v>=2)pr++;if(v)kd++}
  s=Math.min(s,6-pr+Math.max(0,7-kd));

function canSets(c,n){

  if(c[i]>=3){c[i]-=3;const ok=canSets(c,n-1);c[i]+=3;if(ok)return true}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const ok=canSets(c,n-1);c[i]++;c[i+1]++;c[i+2]++;if(ok)return true}

}
function agariC(c,mn){

function waitsOf(ids,mn){const c=cnt34(ids),w=[];for(let k=0;k<34;k++){if(c[k]>=4)continue;c[k]++;if(agariC(c,mn))w.push(k);c[k]--}return w}

    if(c[i]>=3){c[i]-=3;acc.push({t:'k',k:i});rec(acc,n-1);acc.pop();c[i]+=3}
    if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;acc.push({t:'s',k:i});rec(acc,n-1);acc.pop();c[i]++;c[i+1]++;c[i+2]++}};

const nextDora=k=>k<27?(k%9===8?k-8:k+1):k<31?(k===30?27:k+1):(k===33?31:k+1);

function mjEval(handIds,melds,wk,x){

    let b;if(han>=13)b=8000;else if(han>=11)b=6000;else if(han>=8)b=4000;else if(han>=6)b=3000;else if(han>=5)b=2000;else b=Math.min(2000,fu*Math.pow(2,han+2));

  };
  const res=[];

  if(closed&&!melds.length&&c.filter(v=>v===2).length===7){const y=[...base,['치또이츠',2]];if(allK.every(isTerm))y.push(['혼노두',2]);res.push(fin(y,25,ymB))}
  const meldSets=melds.map(m=>({t:m.type==='chi'?'s':'k',k:Math.min(...m.ids.map(K)),open:m.type!=='ankan',kan:/kan/.test(m.type)}));

const DESK_IDS=['pPad','pFolder','memo','pMug','pBadge'];
const DESK_DEF={};
const deskState=()=>{SAVE.desk=SAVE.desk||{};return SAVE.desk};
const deskScale=()=>{const d=$('#desk');return d.getBoundingClientRect().width/d.offsetWidth||1};
function applyDesk(){
  const S=deskState();
  for(const id of DESK_IDS){const el=$('#'+id);if(!el)continue;
    if(!DESK_DEF[id])DESK_DEF[id]={x:parseFloat(el.style.left),y:parseFloat(el.style.top)};
    const p=S[id]||{};el.style.left=(p.x??DESK_DEF[id].x)+'px';el.style.top=(p.y??DESK_DEF[id].y)+'px';
    el.classList.toggle('gone',!!p.gone);}

let deskDrag=null,deskJustDragged=false;
function deskDown(e){
  const el=e.target.closest('.dp');if(!el||!DESK_IDS.includes(el.id)||e.button>0)return;
  if(e.target.closest('#fGo,.bd-edit,#bdName'))return;
  deskDrag={el,id:el.id,x0:e.clientX,y0:e.clientY,l0:parseFloat(el.style.left),t0:parseFloat(el.style.top),moved:false,s:deskScale(),hist:[[e.clientX,e.clientY,performance.now()]]};
  el.setPointerCapture&&el.setPointerCapture(e.pointerId);
}
function deskMove(e){
  const d=deskDrag;if(!d)return;const dx=e.clientX-d.x0,dy=e.clientY-d.y0;
  if(!d.moved&&Math.hypot(dx,dy)<7)return;
  if(!d.moved){d.moved=true;d.el.classList.add('dragging');if(d.id==='pFolder')d.el.classList.remove('open')}
  d.el.style.left=(d.l0+dx/d.s)+'px';d.el.style.top=(d.t0+dy/d.s)+'px';
  d.hist.push([e.clientX,e.clientY,performance.now()]);while(d.hist.length>2&&performance.now()-d.hist[0][2]>90)d.hist.shift();
}
function deskUp(e){
  const d=deskDrag;deskDrag=null;if(!d||!d.moved)return;
  deskJustDragged=true;setTimeout(()=>deskJustDragged=false,0);
  d.el.classList.remove('dragging');
  const a=d.hist[0],b=d.hist[d.hist.length-1],dt=Math.max(1,b[2]-a[2]),vx=(b[0]-a[0])/dt,vy=(b[1]-a[1])/dt,sp=Math.hypot(vx,vy);
  const S=deskState();
  const r=d.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,off=d.id==='pFolder'?(r.right<60||r.left>innerWidth-60||r.top>innerHeight-60):(cx<0||cx>innerWidth||cy<0||cy>innerHeight);
  if(sp>1.1||off){throwProp(d.el,off&&sp<=1.1?(cx<innerWidth/2?-1:1)*.8:vx,off&&sp<=1.1?.6:vy);return}
  S[d.id]={x:parseFloat(d.el.style.left),y:parseFloat(d.el.style.top)};save();sfx('tap');
}
function throwProp(el,vx,vy){
  const S=deskState(),id=el.id,s=deskScale();
  el.style.setProperty('--tx',(vx*420/s)+'px');el.style.setProperty('--ty',(vy*420/s+120)+'px');el.style.setProperty('--tr',(vx>0?1:-1)*(25+Math.random()*30)+'deg');
  el.classList.add('flying');sfx('swing');setTimeout(()=>sfx('hit'),420);
  setTimeout(()=>{el.classList.remove('flying');S[id]={...(S[id]||{}),gone:1};el.classList.add('gone');save();checkDeskEmpty()},600);
}
let deskRestoring=false;
function checkDeskEmpty(){
  const S=deskState();if(deskRestoring)return;
  if(DESK_IDS.every(id=>S[id]&&S[id].gone)){deskRestoring=true;setTimeout(restoreDesk,3500)}
  else{clearTimeout(checkDeskEmpty.t);checkDeskEmpty.t=setTimeout(()=>{if(!deskRestoring&&DESK_IDS.some(id=>deskState()[id]&&deskState()[id].gone)){deskRestoring=true;restoreDesk()}},45000)}
}

  mat:{t:'장패드',o:{green:['그린',['#1f3329','#101c16']],black:['블랙',['#2c2c2f','#131315']],wine:['버건디',['#4d1d25','#2a0d13']],navy:['네이비',['#1e2c48','#0e1628']],tan:['탄',['#7d5636','#4f3520']],grey:['그레이',['#4b4e53','#2c2e32']],cream:['크림',['#cfc3ad','#a99c84']]}},
  mug:{t:'머그컵',o:{char:['차콜',['#5d6169','#2b2e34','#1c1e22','#2a2d33','#1a1b1f']],white:['화이트',['#ffffff','#e4e3df','#c8c6c0','#d9d8d3','#e9e8e3']],blue:['블루',['#79a6e6','#3463b0','#22427c','#2f5aa0','#e9eef6']],red:['레드',['#e47a72','#b0372f','#7a211b','#a3322b','#f1e6e4']],mint:['민트',['#a7e3d1','#5bb39b','#357d6a','#4fa18a','#eef6f3']],yellow:['옐로',['#f7de85','#d8b343','#a3841f','#c9a53b','#f6f1e1']],pink:['핑크',['#f6b8cb','#d97c9b','#a8516f','#cc6f8e','#f7eef1']]}},
  note:{t:'포스트잇',o:{yellow:['옐로',['#e9d47f','#dcc36b','#bfa652']],pink:['핑크',['#f5b3c8','#eb98b4','#c97494']],mint:['민트',['#b3e8d4','#97d8c0','#72b89d']],blue:['블루',['#b2d3f2','#98c1e8','#7099c4']],orange:['오렌지',['#f8c387','#efab68','#c98641']],lilac:['라벤더',['#d4c1f2','#bfa8e8','#9a83c6']],white:['화이트',['#f4f2ec','#e6e3da','#c4c0b4']]}},
  lan:{t:'출입증 줄',o:{theme:['테마 색',null],black:['블랙','#2b2b2e'],red:['레드','#c0392b'],navy:['네이비','#2c4a8a'],green:['그린','#2f8a5a'],white:['화이트','#d9d9d9'],gold:['골드','#c9a03a']}}
};
const DL_DEF={desk:'walnut',mat:'green',mug:'char',note:'yellow',lan:'theme'};
const deskLook=()=>Object.assign({},DL_DEF,SAVE.deskLook||{});
function deskSwatch(part,k){
  const v=DESK_LOOK[part].o[k][1];
  if(part==='desk')return `repeating-linear-gradient(90.6deg,rgba(0,0,0,.16) 0 1px,transparent 1px 5px),linear-gradient(175deg,${v[0]},${v[2]})`;
  if(part==='mat')return `radial-gradient(ellipse at 50% 30%,${v[0]},${v[1]})`;
  if(part==='mug')return `radial-gradient(circle at 50% 50%,#3a2414 0 34%,${v[4]} 35% 44%,transparent 45%),radial-gradient(circle at 38% 34%,${v[0]},${v[1]} 55%,${v[2]})`;
  if(part==='note')return `linear-gradient(175deg,${v[0]},${v[1]})`;
  return v?`repeating-linear-gradient(0deg,${v} 0 4px,color-mix(in srgb,${v} 80%,#000) 4px 8px)`:'repeating-linear-gradient(0deg,var(--acc) 0 4px,color-mix(in srgb,var(--acc) 70%,#000) 4px 8px)';
}
function applyDeskLook(){
  const L=deskLook(),g=(p)=>(DESK_LOOK[p].o[L[p]]||DESK_LOOK[p].o[DL_DEF[p]])[1];
  const d=g('desk'),m=g('mat'),u=g('mug'),n=g('note'),l=g('lan');
  const light=['maple','white'].includes(L.desk)||['white','cream'].includes(L.mat);
  let css=`html body{background:radial-gradient(ellipse 34% 46% at 50% 42%,rgba(255,206,140,.20),rgba(255,206,140,.07) 55%,transparent 75%),radial-gradient(ellipse 110% 90% at 50% 45%,transparent 30%,rgba(0,0,0,${light?.6:.82}) 100%),repeating-linear-gradient(90.6deg,rgba(0,0,0,.16) 0 1px,transparent 1px 5px),repeating-linear-gradient(89.7deg,rgba(255,225,190,.03) 0 2px,transparent 2px 37px),linear-gradient(175deg,${d[0]},${d[1]} 55%,${d[2]})}
#pPad{background:radial-gradient(ellipse at 50% 40%,${m[0]},${m[1]})}
.mug .rim{background:radial-gradient(circle at 38% 34%,${u[0]},${u[1]} 55%,${u[2]})}
.mug .in{background:${u[4]}}
.mug .hd{border-color:${u[3]}}
.memo,.memo-fly{background:linear-gradient(175deg,${n[0]},${n[1]})}
.memo::after{background:linear-gradient(135deg,${n[1]} 50%,${n[2]} 50%)}`;
  if(l)css+=`\n.badge .lan{--acc:${l}}`;
  let st=document.getElementById('deskLookCss');if(!st){st=document.createElement('style');st.id='deskLookCss';document.head.appendChild(st)}
  st.textContent=css;
}
function openDeskSheet(){
  const L=deskLook();
  openSheet(`<div class="sh-title">책상 꾸미기</div>
    ${Object.entries(DESK_LOOK).map(([p,P])=>`<div class="sec-h">${P.t}</div><div class="wp-g dl-g">${Object.entries(P.o).map(([k,[nm]])=>`<button class="wp ${L[p]===k?'on':''}" data-dl="${p}" data-k="${k}"><i style="background:${deskSwatch(p,k)}"></i><small>${nm}</small></button>`).join('')}</div>`).join('')}
    <button class="cap wide" id="dlReset" style="margin-top:14px">기본으로 되돌리기</button>`);
  const S=$("#sheet");
  S.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const p=b.dataset.dl;SAVE.deskLook=Object.assign(deskLook(),{[p]:b.dataset.k});save();applyDeskLook();sfx('tap');S.querySelectorAll(`[data-dl="${p}"]`).forEach(x=>x.classList.toggle('on',x===b))});
  S.querySelector('#dlReset').onclick=()=>{SAVE.deskLook={...DL_DEF};save();applyDeskLook();sfx('tap');openDeskSheet()};
}
applyDeskLook();
/* 폰 옮기기: 베젤(화면 바깥 테두리)을 잡고 끌기 */
const PORT0={x:620,y:886};
function phonePos(){const S=deskState();return S.phone||{x:0,y:0}}
function applyPhonePos(){
  const p=phonePos(),b=$('#phoneBox');if(!b)return;
  const off=!$('#desk').classList.contains('narrow')&&!$('#desk').classList.contains('col');
  b.style.translate=off&&(p.x||p.y)?`${p.x}px ${p.y}px`:'';
  PORT.x=PORT0.x+(off?p.x:0);PORT.y=PORT0.y+(off?p.y:0);updateCable();
}
let phDrag=null;
$('#phone').addEventListener('pointerdown',e=>{
  if(e.button>0||e.target.closest('#screen'))return;
  if($('#desk').classList.contains('narrow')||$('#desk').classList.contains('col'))return;
  const p=phonePos();phDrag={x0:e.clientX,y0:e.clientY,px:p.x,py:p.y,s:deskScale(),moved:false};
});
window.addEventListener('pointermove',e=>{
  const d=phDrag;if(!d)return;const dx=(e.clientX-d.x0)/d.s,dy=(e.clientY-d.y0)/d.s;
  if(!d.moved&&Math.hypot(dx,dy)<6)return;
  if(!d.moved){d.moved=true;$('#phoneBox').classList.add('ph-drag')}
  const x=Math.max(-415,Math.min(415,d.px+dx)),y=Math.max(-40,Math.min(40,d.py+dy));
  deskState().phone={x,y};applyPhonePos();
});
window.addEventListener('pointerup',()=>{const d=phDrag;phDrag=null;if(!d||!d.moved)return;$('#phoneBox').classList.remove('ph-drag');deskJustDragged=true;setTimeout(()=>deskJustDragged=false,0);save();sfx('tap')});
applyPhonePos();
addEventListener('resize',()=>setTimeout(applyPhonePos,50));

function cableGeom(){
  const P=PHS(),pl=!!P.chg,c=P.cable||{x:772,y:893};
  let p,phi,ex,ey;
  if(pl){p={x:PORT.x,y:PORT.y+12};phi=0;ex=PORT.x+(P.cableSide==='l'?-260:260);ey=1350}
  else{p=c;const right=p.x>=PORT.x;ex=right?1720:-480;ey=Math.max(120,Math.min(760,p.y-260));
    const dx=right?1:-1,dy=.35;phi=Math.atan2(-dx,dy)*180/Math.PI}
  const r=phi*Math.PI/180,dir={x:-Math.sin(r),y:Math.cos(r)},tail={x:p.x+dir.x*29,y:p.y+dir.y*29};
  const c1={x:tail.x+dir.x*90,y:tail.y+dir.y*90};
  const d=pl?`M${tail.x} ${tail.y} C ${c1.x} ${c1.y+40}, ${ex} ${ey-280}, ${ex} ${ey}`:`M${tail.x} ${tail.y} C ${c1.x} ${c1.y}, ${ex+(ex>PORT.x?-520:520)} ${ey+260}, ${ex} ${ey}`;
  return{pl,p,phi,d};
}
function updateCable(){
  const g=cableGeom(),w=$('#cbW'),h=$('#cbHit'),pg=$('#cbPlug'),ph=$('#cbPH');if(!w)return;
  w.setAttribute('d',g.d);h.setAttribute('d',g.d);
  pg.setAttribute('transform',`translate(${g.p.x} ${g.p.y}) rotate(${g.phi})`);
  ph.setAttribute('cx',g.p.x);ph.setAttribute('cy',g.p.y);
  $('#pCable').classList.toggle('plugged',g.pl);
}
let cbDrag=null,cbJust=false;
function cableDown(e){
  if(e.target.id!=='cbPH'&&e.target.id!=='cbHit')return;
  cbDrag={x0:e.clientX,y0:e.clientY,moved:false,s:deskScale(),start:cableGeom().p};e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);e.stopPropagation();
}
function cableMove(e){
  const d=cbDrag;if(!d)return;const dx=e.clientX-d.x0,dy=e.clientY-d.y0;if(!d.moved&&Math.hypot(dx,dy)<7)return;
  const P=PHS();if(!d.moved){d.moved=true;if(P.chg){P.chg=false;updateBatt()}}
  P.cable={x:d.start.x+dx/d.s,y:d.start.y+dy/d.s};updateCable();
}
function cableUp(){
  const d=cbDrag;cbDrag=null;if(!d||!d.moved)return;cbJust=true;setTimeout(()=>cbJust=false,0);
  const P=PHS(),c=P.cable;
  if(Math.hypot(c.x-PORT.x,c.y-(PORT.y+13))<70){P.chg=true;P.cableSide=c.x>=PORT.x?'r':'l';sfx('unlock');notify('충전 중',`배터리 ${Math.round(P.batt)}% · 충전을 시작했어요.`)}else sfx('tap');
  save();updateCable();updateBatt();
}
(function bindDesk(){
  const props=$('#props');
  props.addEventListener('pointerdown',deskDown);window.addEventListener('pointermove',e=>{deskMove(e);cableMove(e)});window.addEventListener('pointerup',e=>{deskUp(e);cableUp(e)});
  props.addEventListener('click',e=>{if(deskJustDragged){e.stopPropagation();e.preventDefault()}},true);
  $('#cableLayer').addEventListener('pointerdown',cableDown);
  $('#pCable').addEventListener('click',e=>{if(cbJust){e.stopPropagation();e.preventDefault()}},true);
})();

/* ───────────── 잠금화면 · 시계 · 화면 맞춤 ───────────── */
function nowStr(){const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
function lockTime(){const d=new Date();return `<b>${d.getHours()}</b><i>:</i><b>${String(d.getMinutes()).padStart(2,'0')}</b>`}
function tick(){$('#clock').textContent=nowStr();const lt=$('.lk-time');if(lt)lt.innerHTML=lockTime()}
setInterval(tick,10000);

  overlayMode='lock';const d=new Date(),days='일월화수목금토',nx=nextMission();
  $('#overlay').innerHTML=`<div class="lock">
    <div class="lk-date">${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일</div>
    <div class="lk-time lf-${(PHS().lock||{}).font||'theme'}">${lockTime()}</div><div class="lk-ws">${((PHS().lock||{w:['op','att']}).w).map(lockWidgetHTML).join('')}</div>
    <div class="lk-n k-alert" id="lkOp" style="cursor:pointer"><div class="n-ic">!</div><div class="n-tx"><div class="n-hd"><span>센터 본부 · 긴급</span><span>지금</span></div><b>출동 명령${nx?`: ${nx.name}`:''}</b><p>제3기동대 센티넬·가이드 전원 출동. 작전 단말에서 지휘를 시작하세요.</p></div></div>
    <div class="lk-n k-bond"><div class="n-ic" style="background:${CHARS.haeon.bg};color:#fff">${CHARS.haeon.av}</div><div class="n-tx"><div class="n-hd"><span>메시지 · ${CHARS.haeon.n}</span><span>8분 전</span></div><b>${CHARS.haeon.n}</b><p>${escH(nm('지휘관님, 오늘도 현장 나가세요?'))}</p></div></div>
    <div class="lk-sp"></div>
    <div class="lk-act"><button class="cap pri wide" id="btnUnlock">${ico('lock')}잠금 해제</button><p class="lk-tip">알림을 누르면 바로 해당 앱이 열려요</p><div class="lk-brand">${LOGO}<span>${GAME.name} <i>${GAME.en}</i></span></div></div>
    <div class="home" style="width:100%"></div></div>`;
  $('#overlay').classList.add('on');
  $('#btnUnlock').onclick=()=>unlock();
  $('#lkOp').onclick=()=>{unlock();setTimeout(()=>openApp('game'),300)};
  $('#overlay').querySelector('.k-bond').onclick=()=>{unlock();setTimeout(()=>openChat('haeon'),300)};
}
function unlock(){
  sfx('unlock');renderHome();nextIdle=1;msgLastTick=Date.now();
  const l=$('#overlay').firstElementChild;
  if(l){l.style.transition='transform .42s cubic-bezier(.5,0,.75,.4),opacity .42s';l.style.transform='translateY(-100%)';l.style.opacity='.4'}
  setTimeout(closeOverlay,400);
  if(!attToday())setTimeout(()=>{if(!overlayMode&&!attToday())openAttSheet()},900);
}
function fit(){
  const d=$('#desk'),wide=innerWidth/innerHeight>=1.15;d.classList.remove('col');d.classList.toggle('narrow',!wide);
  const W=wide?1240:470,H=910;
  const s=Math.min((innerHeight-16)/H,(innerWidth-16)/W,1.15);
  d.style.width=W+'px';d.style.height=H+'px';d.style.transform=`scale(${s})`;
  const w=$('#deskWrap');w.style.width=W*s+'px';w.style.height=H*s+'px';
  if(typeof applyPhonePos==='function')applyPhonePos();
}
addEventListener('resize',fit);

$('#live').onclick=()=>{if(G&&G.inBattle){closePanel();if(overlayMode==='lock')unlock();setTimeout(()=>openApp('game'),overlayMode?450:0)}};
{const e=$('#edgeBack');let x0=null;
  e.addEventListener('pointerdown',ev=>{x0=ev.clientX;e.setPointerCapture(ev.pointerId)});
  e.addEventListener('pointerup',ev=>{if(x0!=null&&ev.clientX-x0>36)goBack();x0=null});}
/* ───────────── 시작 ───────────── */
SAVE=Object.assign(fresh(),SAVE);messengerState();seedChats();if(!chatOf('squad').length)deliver(CONV_BY_ID['seed-squad'],{},true);
applyTheme();fit();tick();applyDesk();
newGame();renderHome();render();SAVE.registered?showLock():showRegister();
</script>
