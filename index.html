<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파장 WAVELENGTH — 센가버스 카드 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&family=Do+Hyeon&family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ── 기본 · 색상 토큰 ── */
:root{--s0:#0b0c10;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--sep:rgba(84,84,88,.4);--t1:#fff;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.3);--acc:#30d5c8;--accInk:#00201d;--wall:#05060a;--red:#ff453a;--org:#ff9f0a;--yel:#ffd60a;--grn:#30d158;--a:#64d2ff;--b:#bf5af2;--c:#ff9f0a;--o:#aeaeb2;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html, body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--t1);-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse 60% 50% at 28% 22%,color-mix(in srgb,var(--acc) 16%,#06070a),transparent 70%),radial-gradient(ellipse 55% 50% at 78% 82%,#2a1838,transparent 70%),#06070a}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#stage{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
#deskWrap{position:relative;flex:none}
#desk{position:absolute;top:0;left:0;transform-origin:0 0;display:flex}
#phoneBox{position:relative;width:410px;height:860px;flex:none}
#phone{position:absolute;top:0;left:0;width:410px;height:860px;transform-origin:0 0;border-radius:62px;padding:10px;background:linear-gradient(150deg,#4a4d55 0%,#1d1f24 18%,#2c2f36 50%,#141519 82%,#3d4047 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 0 0 1px #000,0 50px 100px rgba(0,0,0,.65)}
#phone::before{content:"";position:absolute;inset:4px;border-radius:58px;background:#000;z-index:0}
#phone>.btnside{position:absolute;width:3px;border-radius:2px;background:#3a3d44}
.screen{position:relative;z-index:1;width:390px;height:840px;border-radius:52px;overflow:hidden;display:flex;flex-direction:column;background:var(--s0)}
.screen>.statusbar{position:absolute;top:0;left:0;right:0;pointer-events:none}
.screen.shake{animation:shk .4s}
.screen>.statusbar{z-index:55}
#desk{gap:30px;align-items:center}
#phoneBox::before{content:"";position:absolute;inset:-22px -22px;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.05);outline:1.5px dashed rgba(210,230,210,.18);outline-offset:-9px;z-index:-1}
#desk{justify-content:center}
#phoneBox{z-index:2}
html body{background:radial-gradient(ellipse 34% 46% at 50% 42%,rgba(255,206,140,.20),rgba(255,206,140,.07) 55%,transparent 75%),
  radial-gradient(ellipse 110% 90% at 50% 45%,transparent 30%,rgba(0,0,0,.82) 100%),
  repeating-linear-gradient(90.6deg,rgba(0,0,0,.16) 0 1px,transparent 1px 5px),
  repeating-linear-gradient(89.7deg,rgba(255,225,190,.03) 0 2px,transparent 2px 37px),
  linear-gradient(175deg,#2b1c12,#1d130c 55%,#140d08)}
#phoneBox::before{display:none}
#pMat{width:454px;height:904px;border-radius:24px;background:radial-gradient(ellipse at 50% 30%,#1f3329,#101c16);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.05);outline:1.5px dashed rgba(200,215,200,.10);outline-offset:-9px;filter:none;cursor:grab}
#pMat:hover{transform:none;filter:none}
#props .dp.mat.dragging{transform:scale(1.005);filter:brightness(1.05)}
#phone{cursor:grab}#phone .screen{cursor:auto}
#phoneBox.ph-drag{filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}#phoneBox.ph-drag #phone{cursor:grabbing}
#stage{position:fixed;inset:0;overflow:clip}

/* ── 시스템 UI · 상태 표시줄 · 알림 ── */
.statusbar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 32px 0 40px;position:relative;font-size:16px;font-weight:600;letter-spacing:-.2px}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000}
.sicons{display:flex;align-items:center;gap:6px}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.bars i{width:3px;border-radius:1px;background:#fff}
.batt{width:25px;height:12px;border:1.3px solid rgba(255,255,255,.45);border-radius:4px;padding:1.5px;position:relative}
.batt::after{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:4px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.45)}
.batt i{display:block;height:100%;width:78%;background:#fff;border-radius:1.5px}
.home{height:30px;display:flex;align-items:center;justify-content:center}
.home::after{content:"";width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.7)}
#notifLayer{position:absolute;left:0;right:0;top:52px;z-index:40;pointer-events:none}
.notif{position:absolute;left:9px;right:9px;top:0;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:24px;background:rgba(44,44,46,.82);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 12px 32px rgba(0,0,0,.45);transform:translateY(-150%);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.4,1),opacity .3s}
.notif.show{transform:translateY(0);opacity:1}
.notif.hide{transform:translateY(-30%) scale(.95);opacity:0;transition:all .3s}
.n-ic{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 80%,#fff),color-mix(in srgb,var(--acc) 45%,#000));color:var(--accInk)}
.k-alert .n-ic{background:linear-gradient(145deg,#ff6b5e,#a5160c);color:#fff}
.k-enemy .n-ic{background:linear-gradient(145deg,#3a3a3c,#1c1c1e);color:#ff7a70}
.k-bond .n-ic{background:linear-gradient(145deg,#ffe58a,#c98a12);color:#3a2500}
.n-tx{flex:1;min-width:0;font-size:13px;line-height:1.35}
.n-hd{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t2);margin-bottom:1px}
.n-tx>b{font-size:13.5px;font-weight:700}
.n-tx p{color:rgba(235,235,245,.85)}
.n-tx p b{color:#fff}
#toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.85);opacity:0;padding:16px 30px;border-radius:24px;background:rgba(44,44,46,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);text-align:center;pointer-events:none;z-index:35;transition:all .35s cubic-bezier(.2,1.3,.4,1)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast b{display:block;font-size:24px;font-weight:900;letter-spacing:-.5px}
#toast span{font-size:12px;color:var(--t2)}
#toast.ai b{color:#ff7a70}
#toast.me b{color:var(--acc)}
.sb-sp{height:50px;flex:none}
#homeBar{position:absolute;left:0;right:0;bottom:0;height:28px;z-index:48;display:flex;align-items:center;justify-content:center}
#homeBar::after{content:"";width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.75)}
#vig{position:absolute;inset:0;pointer-events:none;z-index:29;box-shadow:inset 0 0 90px 20px rgba(255,40,40,.0);transition:box-shadow .4s}
#vig.on{box-shadow:inset 0 0 90px 24px rgba(255,40,40,.55);transition:none}
.notif{pointer-events:none}
.punch, .sb-pct, #navBar, .gbtn{display:none}
#navBar button{width:66px;height:40px;display:grid;place-items:center;color:rgba(255,255,255,.88);border-radius:20px}
#navBar button:active{background:rgba(255,255,255,.14)}
#navBar svg.i{width:19px;height:19px;stroke-width:2.1}

/* ── 바텀 시트 · 목록 ── */
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto}
.sub-acts{display:flex;gap:8px;margin-top:12px}
.sub-acts .cap{height:44px;font-size:14px}
#sheetBack{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#sheetBack.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow:auto;z-index:31;background:#1c1c1e;border-radius:30px 30px 0 0;padding:8px 16px 34px;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1,.3,1);scrollbar-width:none}
#sheet.on{transform:translateY(0)}
#sheet .grab{margin-bottom:12px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 14px}
.hero .ring{width:84px;height:84px}
.hero .ring circle{stroke-width:5}
.hero .face{inset:9px;font-size:18px}
.hero .ib{font-size:11px;height:18px;line-height:15px;padding:0 7px;bottom:-8px}
.hero .hface{width:72px;height:72px;font-size:18px}
.hero .tile{width:72px;height:72px;border-radius:20px}
.hero .tile svg.i{width:34px;height:34px}
.hero h2{font-size:24px;font-weight:800;margin-top:14px;letter-spacing:-.5px}
.hero .cl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--t2)}
.chip.w{color:var(--w);background:color-mix(in srgb,var(--w) 15%,transparent)}
.sec-h{font-size:12px;color:var(--t2);padding:0 14px 6px;text-transform:uppercase;letter-spacing:.3px}
.group{background:var(--s2);border-radius:14px;overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14.5px;position:relative}
.row+.row::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.row .k{flex:1;color:var(--t1)}
.row .k small{display:block;font-size:11.5px;color:var(--t2);margin-top:1px}
.row .v{color:var(--t2);font-variant-numeric:tabular-nums;text-align:right}
.row .v b{color:var(--t1);font-weight:700}
.row .ric{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.row .ric svg.i{width:17px;height:17px}
.row.btn{cursor:pointer}
.row.btn:active{background:var(--s3)}
.row .chev{color:var(--t3)}
.note{font-size:13px;line-height:1.55;color:var(--t2);padding:0 14px 14px}
.flavor{font-size:12.5px;color:var(--t3);font-style:italic;text-align:center;padding:0 10px 16px}
.why{text-align:center;font-size:12.5px;color:var(--org);margin-top:10px}
.sh-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:14px}
.lgr{display:flex;gap:10px;padding:10px 14px;font-size:13px;line-height:1.45;position:relative}
.lgr+.lgr::before{content:"";position:absolute;left:44px;right:0;top:0;height:.5px;background:var(--sep)}
.lgr .rr{flex:none;width:22px;height:22px;border-radius:50%;font-size:9.5px;font-weight:800;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.lgr.ai .rr{background:rgba(255,69,58,.18);color:#ff7a70}
.lgr em{font-style:normal;color:var(--red);font-weight:800}
.lgr .r{color:var(--red)}
.lgr .g{color:var(--yel)}
.rules .row{align-items:flex-start}
.rules .row .k{font-size:13px;line-height:1.55;color:var(--t2)}
.rules .row .k b{color:var(--t1);font-size:14.5px;display:block;margin-bottom:2px}

/* ── 홈 화면 ── */
#homeView{background:var(--wall);display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,1,.3,1),filter .35s}
#homeView.dim{transform:scale(.94);filter:brightness(.5) blur(2px)}
.hs{flex:1;display:flex;flex-direction:column;padding:0 18px 34px}
.widget{margin-top:14px;border-radius:24px;padding:16px;background:rgba(30,30,34,.45);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);cursor:pointer}
.widget .w-top{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.75)}
.widget .w-top i{width:18px;height:18px;border-radius:5px;background:var(--acc);display:grid;place-items:center;color:var(--accInk);font-style:normal;font-size:10px;font-weight:900}
.widget h3{font-size:22px;font-weight:800;margin-top:10px;letter-spacing:-.4px}
.widget .w-sub{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:2px}
.xpbar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width 1s cubic-bezier(.3,1,.4,1)}
.widget .w-row{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.75)}
.widget .w-row b{color:#fff}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;margin-top:26px}
.appi{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.appi .ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .15s}
.appi:active .ic{transform:scale(.9);filter:brightness(.8)}
.appi .ic svg.i{width:30px;height:30px;stroke-width:1.9}
.appi span{font-size:11.5px;font-weight:500;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.appi em{position:absolute;top:-6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3b30;color:#fff;font-style:normal;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.cal{background:#fff!important;color:#000!important;flex-direction:column;display:flex!important;gap:0;justify-content:center;align-items:center}
.cal small{font-size:10px;font-weight:700;color:#ff3b30;line-height:1}
.cal b{font-size:27px;font-weight:400;line-height:1.05;letter-spacing:-1px}
.hs-sp{flex:1}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.dock{display:flex;justify-content:space-around;padding:14px 10px;border-radius:32px;background:rgba(40,40,46,.45);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5)}
.dock .appi span{display:none}

/* ── 앱 공통 ── */
.view, .app{position:absolute;inset:0}
.app{display:none;flex-direction:column;background:var(--s0);overflow:hidden;border-radius:0}
.app.open{display:flex;animation:appIn .38s cubic-bezier(.2,1,.3,1)}
.app.closing{display:flex;animation:appOut .28s ease-in forwards}
.sub{position:absolute;inset:0;display:none;flex-direction:column}
.sub.on{display:flex}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 16px 44px}
.scroll::-webkit-scrollbar{display:none}
.ap-hd{padding:6px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
.ap-hd small{font-size:12px;color:var(--t2);font-weight:600}
.ap-hd h1{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.backb{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:16px;padding:8px 12px 0 8px;flex:none}
.backb svg.i{width:22px;height:22px}
.seg{display:flex;margin:4px 16px 14px;padding:3px;border-radius:10px;background:var(--s1);flex:none}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--s3);color:var(--t1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.seg2{display:flex;padding:2px;border-radius:9px;background:var(--s3)}
.seg2 button{padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--t2)}
.seg2 button.on{background:#636366;color:#fff}

/* ── 작전 로비 ── */
.cmd{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--s1)),var(--s1) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent);margin-bottom:18px}
.cmd .av.me{width:52px;height:52px;font-size:16px}
.cmd .ci{flex:1;min-width:0}
.cmd .ci b{font-size:16px;font-weight:800}
.cmd .ci small{display:block;font-size:12px;color:var(--t2);margin-top:1px}
.cmd .lv{flex:none;text-align:center;padding:6px 10px;border-radius:14px;background:rgba(0,0,0,.3)}
.cmd .lv small{display:block;font-size:9.5px;color:var(--t2);font-weight:700;letter-spacing:.5px}
.cmd .lv b{font-size:22px;font-weight:900;color:var(--acc);line-height:1.1}
.sec-h2{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:800;letter-spacing:-.4px;margin:4px 2px 10px}
.sec-h2 span{font-size:12px;color:var(--t2);font-weight:600}
.mcard{position:relative;display:flex;align-items:stretch;border-radius:22px;overflow:hidden;background:var(--s1);margin-bottom:12px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .15s}
.mcard:active{transform:scale(.98)}
.mc-art{position:relative;width:96px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--dc) 80%,transparent),transparent 70%),linear-gradient(160deg,color-mix(in srgb,var(--dc) 35%,#000),#0b0c10)}
.mc-boss{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:linear-gradient(145deg,#ff6b5e,#5a0b06);color:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 20px color-mix(in srgb,var(--dc) 60%,transparent)}
.mc-no{position:absolute;top:8px;left:9px;font-size:9.5px;font-weight:900;letter-spacing:1px;color:rgba(255,255,255,.7)}
.mc-body{flex:1;min-width:0;padding:12px 12px 12px 14px}
.mc-top{display:flex;align-items:center;justify-content:space-between}
.dpill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.stars{display:flex;gap:1px}
.stars svg.i{width:15px;height:15px;stroke:none;fill:var(--s3)}
.stars svg.i.on{fill:var(--yel)}
.mc-body b{display:block;font-size:16px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
.mc-body p{font-size:12px;color:var(--t2);margin-top:2px}
.mc-go{display:flex;align-items:center;padding-right:12px;color:var(--t3)}
.mcard.locked{opacity:.55}
.mcard.locked .mc-boss{filter:grayscale(1) brightness(.5)}
.mcard.locked .mc-go{color:var(--t2)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-radius:18px;background:var(--s1);font-size:12.5px;font-weight:600}
.quick button div{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}

/* ── 잠금화면 · VS · 결과 ── */
#overlay{position:absolute;inset:0;z-index:50;display:none}
#overlay.on{display:block}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:96px 10px 0;background:var(--wall)}
.lk-date{font-size:18px;font-weight:600;color:rgba(255,255,255,.85)}
.lk-time{font-size:92px;font-weight:700;line-height:1;margin:2px 0 34px;letter-spacing:-2px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.95)}
.lk-n{width:100%;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:24px;background:rgba(44,44,46,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);animation:fresh .8s .4s both cubic-bezier(.2,1.3,.4,1)}

/* ── 전투 화면 ── */

.cap.danger{background:var(--red);color:#fff}
.cap.wide{width:100%}
.spin{width:15px;height:15px;border:2px solid var(--t3);border-top-color:var(--t1);border-radius:50%;animation:spin .8s linear infinite}
.tray{padding-bottom:30px}
.foe.hit{animation:hit .45s}
.float.big{font-size:22px}
.unit .ring{width:48px;height:48px;margin-top:4px}
.unit .u-ab{display:none}
.unit .face{font-size:11.5px;inset:5px}

/* ── 도감 카드 ── */
.tc{position:relative;height:190px;border-radius:16px;padding:6px;display:flex;flex-direction:column;cursor:pointer;background:linear-gradient(170deg,color-mix(in srgb,var(--w,#5e8bff) 22%,#202127),#141519 62%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--w,#5e8bff) 38%,transparent),0 10px 24px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.3,1.4,.5,1),opacity .2s,box-shadow .2s,filter .2s}
.tc.tI{--w:#5e8bff}
.tc:hover{transform:translateY(-6px) rotate(-.8deg)}
.tc:active{transform:scale(.96)}
.tc.dim{opacity:.42;filter:saturate(.45)}
.tc.sel{transform:translateY(-6px);box-shadow:inset 0 0 0 2px var(--yel),0 0 26px rgba(255,214,10,.35)}
.tc.fresh{animation:deal .65s cubic-bezier(.2,1.2,.4,1)}
.tc-art{position:relative;height:76px;border-radius:11px;overflow:hidden;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 125%,color-mix(in srgb,var(--w) 75%,transparent),transparent 70%),linear-gradient(160deg,color-mix(in srgb,var(--w) 35%,#000),#0b0c10)}
.tc-art .wm{position:absolute;right:5px;bottom:-5px;font-size:24px;font-weight:900;opacity:.16;color:#fff;white-space:nowrap}
.tc-art .hface{width:46px;height:46px;font-size:13px;margin:0}
.tc-art .tile{margin:0;width:44px;height:44px}
.tc-cost{position:absolute;top:4px;left:4px;z-index:2;width:23px;height:23px;border-radius:50%;background:var(--acc);color:var(--accInk);font-size:12.5px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.tc.dim .tc-cost{background:var(--s3);color:var(--t2)}
.tc .gr{position:absolute;top:5px;right:5px;z-index:2}
.tc-nm{font-size:13.5px;font-weight:800;margin:7px 3px 0;letter-spacing:-.3px}
.tc-ty{font-size:9.5px;color:var(--w);font-weight:700;margin:1px 3px 0}
.tc-tx{font-size:9.5px;line-height:1.38;color:var(--t2);margin:4px 3px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tc-ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;background:rgba(0,0,0,.38);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.tc-ft span{display:flex;align-items:center;gap:3px}
.tc-ft svg.i{width:11px;height:11px}
.tc-ft .gv{color:var(--w)}
.dexg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.dexg .tc{height:186px}
.tc .cnt{position:absolute;top:58px;right:9px;z-index:2;font-size:11px;font-weight:900;padding:1px 7px;border-radius:99px;background:rgba(0,0,0,.7);color:var(--t1)}

/* ── 메신저 ── */
.thr{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;cursor:pointer}
.thr:active{background:var(--s1)}
.thr+.thr::before{content:"";position:absolute;left:80px;right:0;top:0;height:.5px;background:var(--sep)}
.thr .tav{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.thr .tx{flex:1;min-width:0}
.thr .tx b{font-size:15.5px;font-weight:700;display:flex;justify-content:space-between}
.thr .tx b small{font-size:12.5px;color:var(--t2);font-weight:400}
.thr .tx p{font-size:13.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.thr .ud{position:absolute;left:5px;top:50%;width:9px;height:9px;margin-top:-4px;border-radius:50%;background:#0a84ff}
.chat-hd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 0 10px;border-bottom:.5px solid var(--sep);flex:none;position:relative}
.chat-hd .tav{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.chat-hd b{font-size:12.5px;font-weight:600}
.chat-hd .backb{position:absolute;left:0;top:0}
.bubbles{display:flex;flex-direction:column;gap:6px;padding:14px 0}
.bub{max-width:78%;padding:9px 13px;border-radius:19px;font-size:14.5px;line-height:1.4;white-space:pre-line}
.bub.them{align-self:flex-start;background:var(--s2);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:6px}
.chat-hd .role{font-size:11px;color:var(--t2);margin-top:-2px}
.affl{font-size:11px;color:#ff375f;letter-spacing:1px;margin-top:1px}
.affl i{font-style:normal;color:var(--s3)}
.bub{animation:none}
.bub.new{animation:fresh .35s both}
.bub.typing{display:flex;gap:4px;padding:12px 14px}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:var(--t2);animation:blink 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.15s}
.bub.typing i:nth-child(3){animation-delay:.3s}
.replies{flex:none;display:flex;flex-direction:column;gap:7px;padding:10px 14px 36px;border-top:.5px solid var(--sep);background:rgba(18,18,20,.96);animation:fresh .3s both}
.replies small{font-size:11px;color:var(--t2);font-weight:600;padding-left:4px}
.replies button{text-align:left;padding:11px 15px;border-radius:18px;font-size:14px;font-weight:600;background:color-mix(in srgb,var(--acc) 12%,var(--s1));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent);color:var(--t1)}
.replies button:active{transform:scale(.98);background:color-mix(in srgb,var(--acc) 25%,var(--s1))}
.thr .uc{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#0a84ff;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.pendtag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:5px;background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc);vertical-align:1px}
.msys{align-self:center;font-size:11.5px;color:var(--t2);background:var(--s1);padding:4px 12px;border-radius:99px;margin:4px 0}
.msys.new{animation:fresh .35s both}
.grow{display:flex;gap:8px;align-items:flex-start;max-width:86%}
.grow.new{animation:fresh .35s both}
.gav{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff}
.gcol{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.gname{font-size:11.5px;color:var(--t2);padding-left:4px}
.grow .bub{max-width:100%}
.bub.media{padding:4px;overflow:hidden}
.bub.media p{padding:6px 9px 4px;font-size:14px}
.mphoto{width:200px;height:150px;border-radius:15px;display:grid;place-items:center;font-size:64px;box-shadow:inset 0 -30px 40px rgba(0,0,0,.25)}
.msticker{font-size:58px;line-height:1.1;padding:2px 4px}
.msticker.me{align-self:flex-end}
.msticker.them{align-self:flex-start}
.msticker.new{animation:pop .45s cubic-bezier(.2,1.8,.4,1) both}
.bub.voice{min-width:210px}
.mvoice{display:flex;align-items:center;gap:9px}
.vplay{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--accInk);font-size:11px;font-weight:900;flex:none}
.bub.me .vplay{background:#fff;color:#0a84ff}
.wave{display:flex;align-items:center;gap:2px;flex:1}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.45}
.wave.on i{opacity:.9;animation:wv .8s ease-in-out infinite alternate}
.wave.on i:nth-child(odd){animation-delay:.2s}
.mvoice span{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.vtx{font-size:13px;margin-top:6px;opacity:.85;font-style:italic}
.mgift{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 6px;min-width:250px}
.gbx{width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,#ffd60a,#ff9f0a);display:grid;place-items:center;font-size:26px;flex:none}
.gi{flex:1;min-width:0}
.gi small{display:block;font-size:10.5px;color:var(--t2)}
.gi b{display:block;font-size:14px}
.gi span{display:block;font-size:10.5px;color:var(--t2)}
.mgift button{padding:7px 12px;border-radius:99px;background:var(--acc);color:var(--accInk);font-size:12.5px;font-weight:800;flex:none}
.mgift button:disabled{background:var(--s3);color:var(--t2)}
.mpoll{padding:10px 10px 8px;min-width:230px}
.mpoll>b{display:block;font-size:14px;margin-bottom:8px}
.po{position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;background:var(--s3);margin-bottom:5px;overflow:hidden;font-size:13px;font-weight:600}
.po i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 30%,transparent);transition:width .6s}
.po span, .po em{position:relative}
.po em{font-style:normal;font-size:11.5px;color:var(--t2)}
.po.on{box-shadow:inset 0 0 0 1.5px var(--acc)}
.mpoll small{font-size:10.5px;color:var(--t2)}
.rwtag{font-style:normal;font-size:10px;font-weight:800;margin-left:6px;padding:1px 6px;border-radius:5px;background:var(--yel);color:#3a2a00;vertical-align:1px}
.bonusbar{margin:0 16px 8px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--yel) 14%,var(--s1));font-size:12px;color:var(--t2)}
.bonusbar b{color:var(--t1)}
.gcount{font-size:12px;color:var(--t2);font-weight:500}

/* ── 설정 ── */
.tgl{width:51px;height:31px;border-radius:16px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tgl.on{background:var(--grn)}
.tgl.on::after{transform:translateX(20px)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.thm{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--t2)}
.thm .pv{width:100%;aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.thm .pv i{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:44%;height:9%;border-radius:99px}
.thm .pv b{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:22px;font-weight:700;color:#fff}
.thm.on{color:var(--t1)}
.thm.on .pv{box-shadow:0 0 0 3px var(--s0),0 0 0 5px var(--acc)}
.prof{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--s2);margin-bottom:18px}
.prof .av.me{width:56px;height:56px;font-size:17px}
.prof b{font-size:18px;font-weight:700}
.prof small{display:block;font-size:12.5px;color:var(--t2)}
.devs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.dev{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 0 12px;border-radius:18px;background:var(--s2);font-size:13.5px;font-weight:700;color:var(--t2)}
.dev small{font-size:10.5px;font-weight:500;color:var(--t3);margin-top:-6px}
.dev.on{color:var(--t1);box-shadow:inset 0 0 0 2px var(--acc)}
.dpv{width:56px;height:108px;border-radius:15px;background:var(--wall);position:relative;box-shadow:0 0 0 3px #2c2f35}
.dpv.gx{border-radius:11px}
.dpv .isl{position:absolute;top:5px;left:50%;width:20px;height:6px;margin-left:-10px;border-radius:4px;background:#000}
.dpv .hb{position:absolute;bottom:5px;left:50%;width:22px;height:2.5px;margin-left:-11px;border-radius:2px;background:#fff}
.dpv .ph{position:absolute;top:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#000}
.dpv .nb{position:absolute;bottom:4px;left:8px;right:8px;display:flex;justify-content:space-between}
.dpv .nb i{width:5px;height:5px;border:1.2px solid #fff;border-radius:1.5px}
.about{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;background:var(--s2);margin-bottom:10px}
.about .logo{width:60px;height:60px;flex:none;border-radius:15px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.about b{display:block;font-size:24px;font-weight:900;letter-spacing:-.5px}
.about span{display:block;font-size:11px;font-weight:700;letter-spacing:4px;color:var(--t2);margin-top:1px}
.about small{display:block;font-size:12px;color:var(--t2);margin-top:6px}

/* ── 캘린더 ── */
#calApp{background:var(--s0)}
.calhd{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 18px 12px}
.calhd small{font-size:13px;color:var(--red);font-weight:700}
.calhd h1{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.calnav{display:flex;gap:6px;align-items:center}
.todayb{height:36px;padding:0 14px;border-radius:18px;background:var(--s1);font-size:13px;font-weight:700}
.wk, .cg{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px}
.wk span{text-align:center;font-size:11.5px;color:var(--t2);padding:4px 0 8px}
.wk span:first-child, .cg .sun{color:#ff6b5e}
.wk span:last-child, .cg .sat{color:#64a8ff}
.cg button{height:50px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:5px;font-size:16px;font-weight:500;border-top:.5px solid var(--sep)}
.cg button span{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.cg .sel span{box-shadow:inset 0 0 0 1.5px var(--t2)}
.cg .today span{background:var(--red);color:#fff;font-weight:800;box-shadow:none}
.cg button i{width:5px;height:5px;border-radius:50%;background:var(--t3)}
.cg .today i{background:var(--red)}
.evs{padding-top:12px;border-top:.5px solid var(--sep);margin-top:4px}
.evh{font-size:13px;font-weight:700;color:var(--t2);padding:2px 2px 10px}
.ev{display:flex;gap:12px;padding:12px 14px;background:var(--s1);border-radius:14px;margin-bottom:8px}
.ev i{width:4px;border-radius:2px;flex:none}
.ev b{display:block;font-size:15px;font-weight:700}
.ev small{font-size:12.5px;color:var(--t2)}

/* ── 날씨 ── */
.wx{flex:1;overflow-y:auto;padding:0 16px 70px;scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wx-load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;color:rgba(255,255,255,.8)}
.wx-top{text-align:center;padding:26px 0 22px;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.wx-top .city{font-size:30px;font-weight:500}
.wx-top .tmp{font-size:92px;font-weight:200;line-height:1;margin-left:22px;font-variant-numeric:tabular-nums}
.wx-top .cond{font-size:18px;font-weight:600;color:rgba(255,255,255,.88)}
.wx-top .hl{font-size:16px;font-weight:600;margin-top:2px}
.wcard{background:rgba(0,0,0,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;padding:11px 14px 12px;margin-bottom:10px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.wcard h4{font-size:12px;font-weight:600;color:rgba(255,255,255,.62);padding-bottom:8px;border-bottom:.5px solid rgba(255,255,255,.16);margin-bottom:10px}
.hours{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hours div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:600;flex:none}
.hours em{font-style:normal;font-size:22px}
.days .dr{display:grid;grid-template-columns:40px 30px 34px 1fr 34px;align-items:center;gap:8px;padding:7px 0;font-size:15px;font-weight:600}
.days .dr+.dr{border-top:.5px solid rgba(255,255,255,.12)}
.days em{font-style:normal;font-size:20px}
.days .lo{color:rgba(255,255,255,.55);text-align:right}
.dbar{height:5px;border-radius:3px;background:rgba(0,0,0,.25);position:relative}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#64d2ff,#ffd60a,#ff9f0a)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wgrid .wcard{margin:0;min-height:108px}
.wgrid b{font-size:30px;font-weight:500;display:block}
.wgrid b small{font-size:14px}
.wgrid .wcard>small{font-size:11px;color:rgba(255,255,255,.65)}
.wsrc{text-align:center;font-size:11px;line-height:1.6;color:rgba(255,255,255,.55);margin-top:14px}

/* ── 카메라 · 지도 · 사진 ── */
.fail{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 44px;text-align:center;overflow:hidden}
.fl-ic{position:relative;width:78px;height:78px;border-radius:20px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:filter .3s}
.fl-ic svg.i{width:38px;height:38px}
.fl-t{position:relative;font-size:19px;font-weight:700}
.fl-st{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13.5px;color:var(--t2);line-height:1.55;min-height:80px}
.fl-st small{font-size:11.5px;color:var(--t3)}
.fl-err{color:var(--org)}
.fl-err svg.i{width:26px;height:26px}
.fail.err .fl-ic{filter:grayscale(.7) brightness(.7)}
.vf{position:absolute;inset:70px 26px 140px}
.vf i{position:absolute;width:26px;height:26px;border:2.5px solid rgba(255,255,255,.7)}
.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.fail-camera .fl-st{color:rgba(255,255,255,.7)}
.mapgrid{position:absolute;inset:0;opacity:.5;background:linear-gradient(115deg,transparent 46%,#c9a94f 46% 48%,transparent 48%),linear-gradient(20deg,transparent 60%,#8f9aa3 60% 61.5%,transparent 61.5%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 38px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 38px),
  radial-gradient(circle at 30% 70%,#1f6b4a 0 18%,transparent 19%),radial-gradient(circle at 75% 25%,#2a5a7a 0 14%,transparent 15%);filter:blur(1.5px)}
.phgrid{position:absolute;inset:60px 4px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;opacity:.35}
.phgrid i{aspect-ratio:1;background:linear-gradient(110deg,#1c1c1e 30%,#2c2c2e 50%,#1c1c1e 70%);background-size:200% 100%;animation:shim 1.2s linear infinite}

/* ── 지휘관 책상 소품 ── */
#desk.col{flex-direction:column}
#desk.col .tc{width:116px;height:196px;flex:none}
#desk.col{gap:14px}
#desk.col #phoneBox{order:-1}
#props{position:absolute;inset:0;pointer-events:none;z-index:0}
#desk.narrow #props{display:none}

/* 실물 비율: 휴대폰 폭 410px = 71.5mm → 1mm ≈ 5.7px */
.dp{position:absolute;transform:rotate(var(--r,0deg));pointer-events:auto;cursor:pointer;transition:transform .35s cubic-bezier(.2,1.2,.4,1),filter .3s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45)) drop-shadow(0 22px 26px rgba(0,0,0,.5))}
.dp:hover{transform:rotate(var(--r,0deg)) translateY(-6px);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4)) drop-shadow(0 34px 34px rgba(0,0,0,.45))}
.dp:focus-visible{outline:3px solid var(--acc);outline-offset:6px}
/* 작전 파일철 (A4 마닐라 폴더 240×320mm) */
.folder{width:1375px;height:1835px}
.fd-paper{position:absolute;inset:18px 10px 0 30px;background:#efebe2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden;font-family:'Nanum Myeongjo',serif;color:#22201c}
.fd-doc{position:absolute;right:40px;top:60px;width:390px}
.fd-doc .k{font:700 15px 'Nanum Myeongjo',serif;letter-spacing:3px;color:#8e2a24;border-bottom:2px solid #22201c;padding-bottom:8px}
.fd-doc h4{font-size:34px;font-weight:800;margin:14px 0 4px;letter-spacing:-.5px;line-height:1.15}
.fd-doc .sub{font-size:16px;color:#5d574c}
.fd-doc p{font-size:16px;line-height:1.7;margin-top:14px;word-break:keep-all}
.fd-doc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:18px;font-size:16px;border-top:1px solid #bdb5a4;padding-top:14px}
.fd-doc dt{color:#6d6658}.fd-doc dd{font-weight:700}
.fd-map{width:220px;height:170px;display:block;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.fd-row{display:flex;gap:16px;align-items:center;margin-top:20px}
.fd-go{display:flex;flex-direction:column;align-items:center;gap:6px}
.fd-go button{width:130px;height:130px;border-radius:50%;border:5px solid #a3302a;color:#a3302a;font:800 32px 'Nanum Myeongjo',serif;letter-spacing:6px;transform:rotate(-10deg);background:rgba(163,48,42,.04);transition:transform .2s,background .2s}
.fd-go button:hover{background:rgba(163,48,42,.12);transform:rotate(-10deg) scale(1.05)}
.fd-go button:disabled{opacity:.45;cursor:default;transform:rotate(-10deg)}
.fd-go small{text-align:center;font:400 24px 'Nanum Pen Script',cursive;color:#a3302a;line-height:1.1}
.fd-cover{position:absolute;inset:0;border-radius:4px 10px 10px 10px;background:linear-gradient(170deg,#b8a06f,#a38b5d 55%,#957d52);box-shadow:inset 0 0 0 1px rgba(60,40,15,.3),inset 0 0 80px rgba(60,40,15,.25);transform-origin:0 50%;transition:transform .7s cubic-bezier(.6,0,.2,1)}
.fd-cover::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,240,210,.25)}
.f-tab{position:absolute;right:120px;top:-42px;width:260px;height:46px;border-radius:12px 12px 0 0;background:#b29967;font:700 20px 'Nanum Myeongjo',serif;color:#4a3a1e;display:flex;align-items:center;justify-content:center;letter-spacing:3px}
.f-label{position:absolute;right:50px;top:110px;width:380px;padding:22px 26px 18px;background:#efe9da;box-shadow:0 1px 3px rgba(0,0,0,.3);font-family:'Nanum Myeongjo',serif;color:#26221c}
.f-label span{display:block;font-size:17px;color:#6d6658;letter-spacing:2px}
.f-label b{display:block;font-size:32px;font-weight:800;margin:6px 0 10px;letter-spacing:-.5px}
.f-label small{display:block;font-size:15px;color:#5a5448;border-top:1px solid #c9c0ad;padding-top:10px}
.f-stamp{position:absolute;right:250px;top:420px;width:170px;height:170px;border-radius:50%;border:6px solid rgba(142,42,36,.6);color:rgba(142,42,36,.66);display:grid;place-items:center;font:800 40px 'Nanum Myeongjo',serif;letter-spacing:8px;transform:rotate(-16deg)}
.f-clip{position:absolute;right:420px;top:-30px;width:30px;height:120px;border-radius:16px;border:6px solid #8f949b;border-bottom-color:#6d7279}
.folder.open .fd-cover{transform:perspective(2400px) rotateY(-74deg)}
.folder.open .f-clip{opacity:0}
/* 포스트잇 (76mm) */
.memo{width:435px;height:435px;padding:44px 40px 30px;background:linear-gradient(175deg,#e9d47f,#dcc36b);font-family:'Nanum Pen Script',cursive;color:#2a2418;line-height:1.1}
.memo::after{content:"";position:absolute;right:0;bottom:0;width:54px;height:54px;background:linear-gradient(135deg,#dcc36b 50%,#bfa652 50%);box-shadow:-3px -3px 6px rgba(0,0,0,.15)}
.memo::before{content:"";position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(180deg,rgba(0,0,0,.05),transparent)}
.memo h5{font-size:34px;font-weight:400;color:#8e2a24;margin-bottom:12px}
.memo p{font-size:44px}
.memo p+p{margin-top:6px}
#props.fopen .memo{transform:rotate(-14deg) translate(-120px,420px);opacity:.0;pointer-events:none}
.memo{transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .4s,filter .3s}
.memo-fly{position:absolute;pointer-events:none;animation:memoFly .7s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes memoFly{to{transform:translate(-160px,520px) rotate(-40deg);opacity:0}}
/* 머그컵 (지름 82mm) */
.mug{width:470px;height:470px;border-radius:50%}
.mug i{position:absolute;display:block;border-radius:50%}
.mug .rim{inset:0;background:radial-gradient(circle at 38% 34%,#5d6169,#2b2e34 55%,#1c1e22);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.mug .in{inset:26px;background:#1a1b1f;box-shadow:inset 0 10px 24px rgba(0,0,0,.8)}
.mug .cof{inset:calc(26px + var(--lv,0px));background:radial-gradient(circle at 46% 44%,#4f311c,#2b190c 70%,#1d1008);box-shadow:inset 0 4px 14px rgba(0,0,0,.7);transition:inset .6s ease,opacity .6s}
.mug.empty .cof{opacity:0}
.mug .gl{left:130px;top:110px;width:150px;height:56px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,230,200,.25),transparent 70%);transform:rotate(-24deg)}
.mug .hd{left:440px;top:170px;width:150px;height:130px;border-radius:60px;border:34px solid #2a2d33;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.mug .ring{inset:42px;border:3px solid rgba(90,55,25,.4);background:none;opacity:0;transition:opacity .6s}
.mug.empty .ring{opacity:1}
.vap{position:absolute;left:180px;top:120px;width:140px;height:260px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,240,225,.12),transparent 65%);filter:blur(16px);animation:vap 6s ease-in-out infinite;pointer-events:none}
.vap.v2{left:250px;animation-delay:3s}
.mug.empty .vap{display:none}
/* 출입증 (CR80 54×86mm) */
.badge{width:310px;height:493px;perspective:1600px}
.badge .lan{position:absolute;left:115px;top:-34px;width:80px;height:52px;border-radius:30px 30px 0 0;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--acc) 45%,#1a1a1a) 0 5px,color-mix(in srgb,var(--acc) 55%,#222) 5px 10px);transform:translateZ(-2px);box-shadow:inset 0 6px 10px rgba(255,255,255,.08)}
.badge .clip{position:absolute;left:128px;top:6px;width:54px;height:30px;border-radius:8px;background:linear-gradient(180deg,#d6d8dc,#8d9096);box-shadow:0 2px 3px rgba(0,0,0,.4);z-index:2}
.bd-flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.badge.back .bd-flip{transform:rotateY(180deg)}
.bd-face{position:absolute;inset:0;border-radius:18px;background:linear-gradient(170deg,#ebe9e4,#d4d1cb);overflow:hidden;color:#1f1f22;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bd-face::before{display:none;content:"";position:absolute;left:115px;top:16px;width:80px;height:14px;border-radius:7px;background:#9c9a95;box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.bd-face.b{transform:rotateY(180deg)}
.bd-top{margin-top:48px;padding:16px 22px;border-top:6px solid color-mix(in srgb,var(--acc) 60%,#333);border-bottom:1px solid #b9b6af}
.bd-top b{display:block;font:800 19px 'Nanum Myeongjo',serif;letter-spacing:-.3px}
.bd-top small{font:600 15px var(--font);color:#5a5852}
.bd-mid{display:flex;gap:18px;align-items:center;padding:24px 22px}
.bd-ph{width:96px;height:118px;background:#c4c1ba;flex:none;display:grid;place-items:end center}
.bd-ph svg{width:78px;height:94px}
.bd-mid b{display:block;font:800 20px var(--font);letter-spacing:-.6px;white-space:nowrap}
.bd-mid small{display:block;font:600 15px var(--font);color:#5a5852;margin-top:4px}
.bd-holo{position:absolute;left:22px;right:22px;bottom:26px;height:46px;border-radius:6px;background:linear-gradient(110deg,rgba(255,255,255,0) 20%,rgba(160,220,255,.45) 40%,rgba(255,200,240,.4) 55%,rgba(255,255,255,0) 75%),repeating-linear-gradient(90deg,#9f9d98 0 2px,transparent 2px 6px);opacity:.75}
.bd-rec{padding:50px 24px 0}
.bd-rec h6{font:800 18px 'Nanum Myeongjo',serif;border-bottom:2px solid #1f1f22;padding-bottom:8px;margin-bottom:6px}
.bd-rec div{display:flex;justify-content:space-between;font:600 16px var(--font);padding:7px 0;border-bottom:1px dashed #b9b6af}
.bd-rec div b{font-weight:800;font-variant-numeric:tabular-nums}
.bd-sign{position:absolute;left:24px;bottom:22px;font:400 30px 'Nanum Pen Script',cursive;color:#2d3b8f}


/* ── 이름 · 호칭 ── */
.nf-l{display:block;font-size:12px;font-weight:700;color:var(--t2);margin:0 4px 6px}
.nf-in{width:100%;height:50px;border-radius:14px;border:0;outline:0;padding:0 16px;font:700 18px var(--font);color:var(--t1);background:var(--s2);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.nf-in:focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
.nf-in::placeholder{color:var(--t3);font-weight:500}
.nf-t{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.nf-l+.nf-in{margin-bottom:16px}
.nf-t button{height:40px;border-radius:12px;background:var(--s2);font-size:14px;font-weight:700;color:var(--t2)}
.nf-t button.on{background:color-mix(in srgb,var(--acc) 22%,var(--s2));color:var(--t1);box-shadow:inset 0 0 0 1.5px var(--acc)}
.nf-pv{font-size:12.5px;color:var(--t2);text-align:center;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--s2) 60%,transparent)}
.nf-pv b{display:block;font-size:17px;color:var(--t1);margin-top:3px}
.reg{position:absolute;inset:0;display:flex;flex-direction:column;padding:96px 22px 40px;background:var(--wall)}
.reg-card{margin-top:auto;padding:22px 18px 18px;border-radius:30px;background:color-mix(in srgb,var(--s1) 86%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);animation:fresh .6s cubic-bezier(.2,1.3,.4,1)}
.reg-hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.reg-hd .logo{width:46px;height:46px;border-radius:12px}
.reg-hd b{display:block;font-family:var(--disp,var(--font));font-size:21px;font-weight:800;letter-spacing:-.4px}
.reg-hd small{font-size:12.5px;color:var(--t2)}
.reg-top{text-align:center;color:#fff}
.reg-top b{display:block;font-family:var(--disp,var(--font));font-size:30px;font-weight:800;letter-spacing:-.6px}
.reg-top small{font-size:13px;opacity:.75}
:root[data-theme=frost] .reg-top{color:#14171c}
.reg .cap.wide{margin-top:14px}
.reg-skip{display:block;margin:12px auto 0;font-size:13px;color:var(--t2);padding:6px 10px}
.prof.btn{cursor:pointer}
.prof.btn:active{background:var(--s3)}
.prof .chev{color:var(--t3)}
.bd-name{cursor:text;border-bottom:1.5px dashed transparent;transition:border-color .2s}
.badge:hover .bd-name{border-bottom-color:#8a877f}
.bd-edit{position:absolute;inset:0;z-index:3;padding:52px 22px 20px;background:linear-gradient(170deg,#ebe9e4,#d4d1cb);border-radius:18px;cursor:default;display:flex;flex-direction:column;gap:10px;font-family:var(--font);color:#1f1f22}
.bd-edit h6{font:800 18px 'Nanum Myeongjo',serif;border-bottom:2px solid #1f1f22;padding-bottom:8px}
.bd-edit input{height:50px;border:0;border-bottom:2px solid #1f1f22;background:transparent;font:400 38px 'Nanum Pen Script',cursive;color:#2d3b8f;outline:0;padding:0 4px}
.bd-edit .tt{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bd-edit .tt button{height:38px;border-radius:8px;font:700 14px var(--font);color:#5a5852;box-shadow:inset 0 0 0 1.5px #b9b6af}
.bd-edit .tt button.on{color:#1f1f22;background:rgba(0,0,0,.06);box-shadow:inset 0 0 0 2px #1f1f22}
.bd-edit .ok{margin-top:4px;height:44px;border-radius:10px;background:#1f1f22;color:#ebe9e4;font:800 16px var(--font)}

/* ── 성장 시스템: 덱 편성 · 앨범 · 업적 · 지시 · 유대 ── */
.dk-hd{justify-content:space-between}
.dk-hd b{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;pointer-events:none}
.dk-reset{font-size:13px;font-weight:600;color:var(--acc);padding:8px 12px}
.dk-sum{margin:2px 16px 12px;padding:14px;border-radius:18px;background:var(--s1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent);flex:none}
.dk-sum.bad{box-shadow:inset 0 0 0 1.5px var(--org)}
.dk-n{display:flex;align-items:baseline;gap:6px}
.dk-n b{font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--acc)}
.dk-sum.bad .dk-n b{color:var(--org)}
.dk-n small{font-size:13px;color:var(--t2)}
.dk-bars{display:flex;gap:12px;font-size:12px;color:var(--t2);margin-top:4px;flex-wrap:wrap}
.dk-bars b{color:var(--t1)}
.dk-wave{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:10px;gap:2px}
.dk-wave i{background:var(--w)}
.dk-wl{display:flex;gap:10px;font-size:11px;font-weight:700;margin-top:5px}
.dk-wl span{color:var(--w)}
.dk-msg{font-size:12px;color:var(--t2);margin-top:8px;line-height:1.45}
.dk-sum.bad .dk-msg{color:var(--org);font-weight:600}
.dk-list{display:flex;flex-direction:column;gap:6px}
.dk-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--s1);cursor:pointer}
.dk-row.locked{opacity:.5}
.dk-row.awk{box-shadow:inset 0 0 0 1.5px #e3b341}
.dk-art{width:38px;height:38px;flex:none;margin:0;font-size:11px}
.dk-art.tile{border-radius:11px}
.dk-art.tile svg.i{width:18px;height:18px}
.dk-tx{flex:1;min-width:0}
.dk-tx b{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700}
.dk-tx small{display:block;font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-tx em{font-style:normal;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:99px}
em.aw{background:linear-gradient(135deg,#ffe58a,#d99a1e);color:#3a2500}
em.bd{background:rgba(255,105,140,.18);color:#ff7a9c}
em.nw{background:var(--acc);color:var(--accInk)}
.dk-cost{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--acc);color:var(--accInk)}
.dk-step{display:flex;align-items:center;gap:2px;flex:none;width:92px;justify-content:flex-end}
.dk-step button{width:30px;height:30px;border-radius:9px;background:var(--s2);font-size:17px;font-weight:700}
.dk-step button:disabled{opacity:.3;cursor:default}
.dk-step span{width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.dk-rule{font-size:11.5px;color:var(--t3);text-align:center;margin:14px 10px 0;line-height:1.5}
/* 앨범 */
.alb-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.alb-p{background:var(--s1);border-radius:14px;padding:6px 6px 8px;overflow:hidden}
.alb-p .mphoto{height:120px;border-radius:10px}
.alb-p.nogot .mphoto{background:var(--s2)}
.alb-p.nogot .mphoto span{opacity:.3}
.alb-p small{display:block;font-size:11.5px;margin-top:6px;line-height:1.35;color:var(--t1);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.alb-p em{display:block;font-style:normal;font-size:10.5px;color:var(--t2);margin-top:2px}
.alb-s{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.alb-s div{aspect-ratio:1;border-radius:14px;background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.alb-s span{font-size:34px}
.alb-s em{font-style:normal;font-size:9.5px;color:var(--t2)}
.alb-s .nogot span{font-size:20px;opacity:.3}
.alb-more{font-size:12px;color:var(--t3);text-align:center}
#photoApp{background:var(--s0)}
/* 업적 */
.ach .row.nogot{opacity:.45}
.ach .row.cur{background:color-mix(in srgb,#c99400 14%,transparent)}
.cur-t{font-size:11px;font-weight:800;color:#e3b341}
/* 오늘의 지시 */
.ord{padding:14px;border-radius:18px;background:var(--s1);margin-bottom:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.ord-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.ord-hd b{font-size:15px;font-weight:800}
.ord-hd small{font-size:11px;color:var(--t2)}
.ord-r{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
.ord-r .ck{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--s3)}
.ord-r .ck svg.i{width:12px;height:12px;stroke-width:3}
.ord-r.done .ck{background:var(--grn);color:#000;box-shadow:none}
.ord-r .t{flex:1}
.ord-r.done .t{text-decoration:line-through;color:var(--t2)}
.ord-r em{font-style:normal;font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums}
/* 전투: 각성 · 유대 · 날씨 */
.unit.awk{box-shadow:inset 0 0 0 1.5px #e3b341,0 0 16px rgba(227,179,65,.25)}
.pills em.aw,.pills em.bd{font-style:normal}
.hc.awk{box-shadow:inset 0 0 0 1.5px #e3b341}
.rwtag.eff{background:color-mix(in srgb,#64d2ff 22%,transparent);color:#64d2ff}
/* 포스트잇 지시 */
.memo .mo{display:flex;align-items:center;gap:10px;font-size:31px;white-space:nowrap}
.memo .mo.done{text-decoration:line-through;text-decoration-thickness:3px;color:rgba(42,36,24,.5)}
.memo .mo i{font-style:normal;font-size:26px;color:#5a4a20;margin-left:auto}
.bd-title{position:absolute;left:24px;right:24px;bottom:66px;font:400 30px 'Nanum Pen Script',cursive;color:#8e2a24;text-align:center}

/* ── 출근 체크 ── */
.att-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.att-logo .logo{width:44px;height:44px;border-radius:12px;display:block}
.att-hd b{display:block;font-family:var(--disp,var(--font));font-size:20px;font-weight:800}
.att-hd small{font-size:12px;color:var(--t2)}
.att-track{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.att-d{position:relative;border-radius:14px;background:var(--s2);padding:8px 4px 8px;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden}
.att-d:last-child{grid-column:span 2;background:linear-gradient(145deg,color-mix(in srgb,#ffd60a 22%,var(--s2)),var(--s2))}
.att-d small{font-size:10px;font-weight:700;color:var(--t2)}
.att-d span{font-size:24px;line-height:1.1}
.att-d em{font-style:normal;font-size:10.5px;line-height:1.25;color:var(--t1);word-break:keep-all}
.att-d.now{box-shadow:inset 0 0 0 2px var(--acc)}
.att-d.got{opacity:.75}
.att-stamp{position:absolute;inset:auto 0 18px;margin:auto;width:58px;height:58px;border-radius:50%;border:3px solid rgba(220,50,40,.85);color:rgba(220,50,40,.9);display:grid;place-items:center;font:800 15px 'Nanum Myeongjo',serif;transform:rotate(-14deg);background:rgba(220,50,40,.06);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:rotate(-14deg) scale(2.2);opacity:0}}
.att-cal{margin-top:16px;padding:12px;border-radius:16px;background:var(--s2)}
.att-mo{font-size:13px;font-weight:700;margin-bottom:8px}
.att-dw,.att-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.att-dw b{font-size:10.5px;color:var(--t3);font-weight:600}
.att-g i{font-style:normal;font-size:12px;height:30px;display:grid;place-items:center;border-radius:9px;color:var(--t2)}
.att-g i.on{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--t1);font-weight:700}

/* 테마 공통 적용 지점 */
.lk-time,.ap-hd h1,.widget h3,.nt b,.sh-title,.hero h2,.res h2,.sec-h2,.calhd h1,#toast b,.vs-side b{font-family:var(--disp,var(--font))}
.pv-clock{font-family:var(--disp,var(--font))}
.arena{background-image:var(--arena),linear-gradient(180deg,rgba(255,69,58,.08),rgba(255,255,255,.015) 42%,rgba(255,255,255,.015) 58%,color-mix(in srgb,var(--acc) 8%,transparent))}
/* 흑월 레드 */
:root[data-theme=moon] .lk-time{color:#ffc2b8;text-shadow:0 0 28px rgba(255,69,58,.65);letter-spacing:0}
.thm .pv[data-theme=moon] .pv-clock{color:#ffc2b8;text-shadow:0 0 28px rgba(255,69,58,.65);letter-spacing:0}
:root[data-theme=moon] .appi .ic{background:#140607!important;color:#ff6b5e!important;box-shadow:inset 0 0 0 1.5px rgba(255,107,94,.55),0 6px 16px rgba(0,0,0,.55)}
.thm .pv[data-theme=moon] .pvi{background:#140607!important;color:#ff6b5e!important;box-shadow:inset 0 0 0 1.5px rgba(255,107,94,.55),0 6px 16px rgba(0,0,0,.55)}
:root[data-theme=moon] .appi .ic.cal{background:#140607!important;color:#ffd8d2!important}
:root[data-theme=moon] .widget{background:rgba(20,6,7,.62);box-shadow:inset 0 0 0 1px rgba(255,107,94,.35)}
:root[data-theme=moon] .notif{box-shadow:inset 0 0 0 1px rgba(255,107,94,.3),0 12px 32px rgba(0,0,0,.45)}
/* 가이드 퍼플 */
:root[data-theme=guide] .lk-time{background:linear-gradient(90deg,#b9a2ff,#ff9bd0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
.thm .pv[data-theme=guide] .pv-clock{background:linear-gradient(90deg,#b9a2ff,#ff9bd0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
:root[data-theme=guide] .appi .ic{background:rgba(255,255,255,.13)!important;color:#fff!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 8px 20px rgba(60,20,120,.45)}
.thm .pv[data-theme=guide] .pvi{background:rgba(255,255,255,.13)!important;color:#fff!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 8px 20px rgba(60,20,120,.45)}
:root[data-theme=guide] .appi .ic.cal{color:#fff!important}
:root[data-theme=guide] .appi .ic.cal small{color:#ff9bd0}
:root[data-theme=guide] .widget{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
/* S급 골드 */
:root[data-theme=gold] .lk-time{color:#ffe08a;font-weight:800;letter-spacing:4px;text-shadow:0 2px 0 #6b4f08}
.thm .pv[data-theme=gold] .pv-clock{color:#ffe08a;font-weight:800;letter-spacing:4px;text-shadow:0 2px 0 #6b4f08}
:root[data-theme=gold] .lk-date{font-family:'Nanum Myeongjo',serif;letter-spacing:2px;color:#e8cf86}
:root[data-theme=gold] .appi .ic{background:linear-gradient(150deg,#1f190a,#0a0804)!important;color:#ffd60a!important;box-shadow:inset 0 0 0 1.5px rgba(255,214,10,.65),inset 0 0 0 4px #0a0804,inset 0 0 0 5px rgba(255,214,10,.25),0 6px 16px rgba(0,0,0,.55);border-radius:12px!important}
.thm .pv[data-theme=gold] .pvi{background:linear-gradient(150deg,#1f190a,#0a0804)!important;color:#ffd60a!important;box-shadow:inset 0 0 0 1.5px rgba(255,214,10,.65),inset 0 0 0 4px #0a0804,inset 0 0 0 5px rgba(255,214,10,.25),0 6px 16px rgba(0,0,0,.55);border-radius:12px!important}
:root[data-theme=gold] .appi .ic.cal{color:#ffe08a!important}
:root[data-theme=gold] .appi .ic.cal small{color:#ffd60a}
:root[data-theme=gold] .widget{background:rgba(12,10,4,.7);box-shadow:inset 0 0 0 1px rgba(255,214,10,.45),inset 0 0 0 5px rgba(12,10,4,.7),inset 0 0 0 6px rgba(255,214,10,.2)}
:root[data-theme=gold] .unit{box-shadow:inset 0 0 0 1px rgba(255,214,10,.22)}
/* 가드 그린 */
:root[data-theme=guard] .lk-time{color:#8be08b;font-weight:700;letter-spacing:-2px;text-shadow:0 0 18px rgba(61,220,106,.45)}
.thm .pv[data-theme=guard] .pv-clock{color:#8be08b;font-weight:700;letter-spacing:-2px;text-shadow:0 0 18px rgba(61,220,106,.45)}
:root[data-theme=guard] .lk-time i{animation:blink 1s steps(1) infinite}
:root[data-theme=guard] .appi .ic{background:#122417!important;color:#8be08b!important;border-radius:10px!important;box-shadow:inset 0 0 0 1.5px rgba(139,224,139,.5),0 6px 14px rgba(0,0,0,.5)}
.thm .pv[data-theme=guard] .pvi{background:#122417!important;color:#8be08b!important;border-radius:10px!important;box-shadow:inset 0 0 0 1.5px rgba(139,224,139,.5),0 6px 14px rgba(0,0,0,.5)}
:root[data-theme=guard] .appi .ic.cal{color:#d8f5d8!important}
:root[data-theme=guard] .appi span{font-family:'Nanum Gothic Coding',monospace}
:root[data-theme=guard] .widget{background:rgba(10,24,14,.72);border-radius:12px;box-shadow:inset 0 0 0 1px rgba(139,224,139,.35)}
:root[data-theme=guard] .notif{border-radius:14px}
/* 백색소음: 라이트 모드 */
[data-theme=frost]{--s0:#eef1f5;--s1:#ffffff;--s2:#e8ebf0;--s3:#d3d8df;--t1:#14171c;--t2:rgba(40,46,58,.62);--t3:rgba(40,46,58,.32);--sep:rgba(60,70,90,.18)}
:root[data-theme=frost] .screen{color:var(--t1)}
:root[data-theme=frost] .vs{color:#fff;--t1:#fff;--t2:rgba(255,255,255,.7)}
:root[data-theme=frost] .statusbar{color:#14171c}

let AC=null;

function noise(d,v){const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start()}

/* ───────────── 전투 규칙 ───────────── */
function draw(side,n,src,quiet){
  const P=G[side];
  for(let i=0;i<n;i++){
    if(!P.deck.length){dmg(side,500);log(side,`${side==='me'?'센터':'흑월'} 보급고 고갈! 본부 <em>-500</em>`);if(G.inBattle&&checkEnd())break;continue}
    const key=P.deck.pop();
    if(P.hand.length>=9){log(side,`수납 초과로 ${CARDS[key].name} 반납`);continue}
    P.hand.push({hid:nid(),key,fresh:side==='me'});
    if(side==='me'&&!quiet)notify(src||'센터 보급 도착',`<b>${CARDS[key].name}</b> (${typeName(CARDS[key])}) 지급 완료`);
  }
}
function dmg(side,n){G[side].lp=Math.max(0,G[side].lp-n);if(side==='ai')G.stats.dealt+=n;if(side==='me'&&G.me.lp>0&&G.me.lp<1500&&!G.lowWarned){G.lowWarned=true;msgTrigger('lowlp',{},1)}G.fx.push({sel:'#lp-'+side,text:'-'+n,cls:'fl-dmg'+(n>=1000?' big':''),side})}
function ufx(u,text,cls,anim){G.fx.push({sel:`[data-uid="${u.uid}"]`,text,cls,anim})}
function addInst(u,n,side){
  if(u.card.type==='G')return;
  u.inst=Math.max(0,Math.min(100,u.inst+n));
  if(u.inst>=100&&!u.berserk){
    u.berserk=true;speak(u,'berserk',true);if(side==='me'){G.stats.berserk++;msgTrigger('berserk',{name:u.card.name,actor:messageActor(u.key),uid:u.uid},1)}sfx('alarm');
    log(side,`<b class="r">⚠ ${u.card.name} 폭주!</b> 통제 불능`);
    if(side==='me')notify('경보: 센티넬 폭주',`<b>${u.card.name}</b> 불안정도 100 도달. 즉시 가이딩이 필요합니다.`,'alert');
    else notify('적 센티넬 폭주 감지',`${u.card.name}이(가) 통제를 벗어났습니다.`,'enemy');
  }else if(u.berserk&&u.inst<70){
    u.berserk=false;if(side==='me')msgTrigger('recover',{name:u.card.name,actor:messageActor(u.key),uid:u.uid},1);log(side,`${u.card.name} 폭주 진정`);
    if(side==='me')notify('폭주 진정',`<b>${u.card.name}</b>의 파장이 안정권으로 돌아왔습니다.`);
  }
}
function kill(side,u){speak(u,'down',true,0);
  const i=G[side].field.indexOf(u);if(i<0)return;G[side].field[i]=null;if(side==='ai'){G.stats.kills++;msgTrigger('kill',{target:u.card.name,uid:u.uid,actor:messageActor(G.msgAttacker)},1)}sfx('destroy');
  log(side,`${u.card.name} 전투 불능 — ${side==='me'?'센터 의료동 후송':'제압 완료'}${u.guide?` (가이드 ${CARDS[u.guide].name} 동반 이탈)`:''}`);
}
function validTargets(side,c){
  const own=G[side].field.filter(Boolean),en=G[opp(side)].field.filter(Boolean);
  switch(c.tgt){case 'own':return own;case 'ownS':return own.filter(u=>u.card.type==='S');case 'ownNoGuide':return own.filter(u=>u.card.type==='S'&&!u.guide);case 'ownPaired':return own.filter(u=>u.guide&&!u.bonded);case 'enemy':return en;default:return[]}
}
function onSummon(side,u){
  const P=G[side],E=G[opp(side)];
  switch(u.card.ab){
    case 'scout':draw(side,1,'정찰 보고 수신');log(side,`${u.card.name} 정찰 — 카드 1장`);break;
    case 'relay':P.sp+=1;log(side,`${u.card.name} 통신 중계 — SP +1`);break;
    case 'weaken':{const t=E.field.filter(Boolean).sort((a,b)=>atkOf(b)-atkOf(a))[0];if(t){t.atkMod-=300;ufx(t,'ATK -300','fl-dmg','hit');log(side,`${u.card.name} 염동 압박 → ${t.card.name} ATK -300`)}break}
    case 'gravity':E.field.filter(Boolean).forEach(t=>{t.atkMod-=200;ufx(t,'ATK -200','fl-dmg','hit')});log(side,`${u.card.name} 중력장 — 상대 전원 ATK -200`);break;
    case 'calm':P.field.filter(x=>x&&x.card.type==='S').forEach(t=>{const cv=15+(perk(u.key).calm||0);addInst(t,-cv,side);ufx(t,'-'+cv,'fl-heal')});log(side,`${u.card.name} 수류 진정 — 아군 불안정도 -${15+(perk(u.key).calm||0)}`);break;
    case 'blink':u.summonRound=G.round-1;log(side,`${u.card.name} 순간이동 — 즉시 공격 가능`);break;
    case 'flash':{const t=E.field.filter(x=>x&&atkOf(x)<=1300).sort((a,b)=>atkOf(b)-atkOf(a))[0];if(t){ufx(t,'제압','fl-dmg','hit');log(side,`${u.card.name} 섬광 — ${t.card.name} 제압`);kill(opp(side),t)}break}
    case 'barrier':P.lp+=500;P.maxLp=Math.max(P.maxLp,P.lp);G.fx.push({sel:'#lp-'+side,text:'+500',cls:'fl-heal'});log(side,`${u.card.name} 결계 — 본부 +500`);break;
    case 'rally':P.field.filter(x=>x&&x!==u&&x.card.type==='S').forEach(t=>{t.atkMod+=100;ufx(t,'ATK +100','fl-gold')});log(side,`${u.card.name} 공명 — 아군 ATK +100`);break;
    case 'chill':E.field.filter(Boolean).forEach(t=>{addInst(t,20,opp(side));ufx(t,'불안정 +20','fl-warn','hit')});log(side,`${u.card.name} 파장 압박 — 상대 전원 불안정 +20`);break;

function playCard(side,hi,t,asField){

    log(side,`<b>${c.name}</b>(${c.grade}급 ${c.elem}) 현장 배치`);

  }else if(c.type==='G'&&asField){
    const slot=P.field.indexOf(null);if(slot<0)return false;
    P.sp-=c.cost;P.hand.splice(hi,1);
    P.field[slot]=mkUnit(h.key);if(side==='me')opsOnDeploy(P.field[slot]);if(side==='me')msgTrigger('fieldguide',{actor:messageActor(h.key),name:c.name,uid:P.field[slot].uid},1);
    log(side,`가이드 <b>${c.name}</b> 현장 투입 (ATK ${c.atk})`);
  }else if(c.type==='G'){

    if(side==='me')notify(m>=85?'고매칭 가이드 배정':'가이드 배정',`${c.name} → ${t.card.name} · 매칭률 <b>${m}%</b>${m>=85?' · ATK +300':''}`,m>=85?'bond':'center');
  }else{
    if(c.tgt!=='none'&&!t)return false;
    P.sp-=c.cost;P.hand.splice(hi,1);
    const O=opp(side);
    switch(h.key){
      case 'i_stab':addInst(t,-30,side);ufx(t,'불안정 -30','fl-heal');break;
      case 'i_amp':addInst(t,-60,side);ufx(t,'불안정 -60','fl-heal');break;
      case 'i_noise':P.field.filter(Boolean).forEach(u=>{addInst(u,-35,side);ufx(u,'-35','fl-heal')});break;
      case 'i_snipe':t.atkMod-=600;ufx(t,'ATK -600','fl-dmg','hit');break;
      case 'i_orbital':dmg(O,700);break;

      case 'i_boost':t.tmp+=500;addInst(t,20,side);ufx(t,'ATK +500','fl-gold');break;

async function startTurn(side){

async function endTurn(side){

/* ───────────── 흑월 AI ───────────── */
function aiPickItem(){
  const P=G.ai,own=P.field.filter(Boolean),foes=G.me.field.filter(Boolean);
  for(const [i,h] of P.hand.entries()){
    const c=CARDS[h.key];if(c.type!=='I'||c.cost>P.sp)continue;
    switch(h.key){
      case 'i_stab':{const t=own.filter(u=>u.inst>=55).sort((a,b)=>b.inst-a.inst)[0];if(t)return{i,t};break}
      case 'i_amp':{const t=own.filter(u=>u.inst>=70).sort((a,b)=>b.inst-a.inst)[0];if(t)return{i,t};break}
      case 'i_noise':if(own.reduce((s,u)=>s+u.inst,0)>=120)return{i};break;
      case 'i_snipe':{const t=foes.slice().sort((a,b)=>atkOf(b)-atkOf(a))[0];if(t&&atkOf(t)>=1400)return{i,t};break}
      case 'i_bond':{const t=own.find(u=>u.guide&&!u.bonded);if(t)return{i,t};break}
      case 'i_boost':{const t=own.find(u=>canAttack('ai',u)&&u.inst<=50&&!u.tmp&&foes.some(f=>atkOf(f)>=atkOf(u)&&atkOf(f)<atkOf(u)+500));if(t)return{i,t};break}
      case 'i_extra':if(P.hand.length<=3)return{i};break;
      case 'i_orbital':return{i};
      case 'i_coffee':if(own.reduce((s,u)=>s+u.inst,0)>=60||P.hand.length<=3)return{i};break;
      case 'i_ration':if(P.lp<=P.maxLp-600)return{i};break;
    }
  }
  return null;
}
async function aiTurn(){
  const g=G,P=G.ai;
  if(!await wait(900,g))return;
  // 1. 센티넬 배치
  for(let k=0;k<3;k++){
    const hs=P.hand.map((h,i)=>({i,c:CARDS[h.key]})).filter(x=>x.c.type==='S'&&x.c.cost<=P.sp).sort((a,b)=>b.c.cost-a.c.cost);
    if(!hs.length||!P.field.includes(null))break;
    playCard('ai',hs[0].i);render();if(!await wait(700,g))return;
  }
  // 2. 가이드 매칭
  for(let k=0;k<3;k++){
    const gs=P.hand.map((h,i)=>({i,key:h.key,c:CARDS[h.key]})).filter(x=>x.c.type==='G'&&x.c.cost<=P.sp).sort((a,b)=>b.c.power-a.c.power);
    const cands=P.field.filter(u=>u&&u.card.type==='S'&&!u.guide);
    if(!gs.length||!cands.length)break;
    const x=gs[0];cands.sort((a,b)=>(matchRate(b.key,x.key)-matchRate(a.key,x.key))||(b.inst-a.inst));
    playCard('ai',x.i,cands[0]);render();if(!await wait(700,g))return;
  }
  // 2-b. 매칭할 센티넬이 없으면 가이드 현장 투입
  for(let k=0;k<3;k++){
    if(!P.field.includes(null)||P.field.some(u=>u&&u.card.type==='S'&&!u.guide))break;
    const gs=P.hand.map((h,i)=>({i,c:CARDS[h.key]})).filter(x=>x.c.type==='G'&&x.c.cost<=P.sp).sort((a,b)=>b.c.atk-a.c.atk);
    if(!gs.length)break;
    playCard('ai',gs[0].i,null,true);render();if(!await wait(700,g))return;
  }
  // 3. 보급품
  for(let k=0;k<6;k++){const ch=aiPickItem();if(!ch)break;playCard('ai',ch.i,ch.t);render();if(!await wait(750,g))return}
  // 4. 공격
  const units=P.field.filter(u=>u&&canAttack('ai',u)).sort((a,b)=>atkOf(b)-atkOf(a));
  for(const u of units){
    if(!onField('ai',u)||!canAttack('ai',u))continue;
    let foes=G.me.field.filter(Boolean);const gd=foes.filter(f=>f.card.ab==='guard');if(gd.length)foes=gd;const a=atkOf(u);let t=null;
    if(foes.length){const k=foes.filter(f=>atkOf(f)<a).sort((x,y)=>atkOf(y)-atkOf(x));if(!k.length)continue;t=k[0]}
    const lethal=!t&&a>=G.me.lp;
    if(u.inst+STRAIN[u.card.grade]>=100&&!lethal)continue;
    await doAttack('ai',u,t);if(!await wait(450,g))return;
  }
  // 5. 추가 지원
  if(P.sp>=2&&!P.supportUsed&&P.hand.length<=3){P.sp-=2;P.supportUsed=true;draw('ai',1);log('ai','흑월 — 암시장 물자 조달 (카드 1장)');render();if(!await wait(500,g))return}
  if(g!==G||G.over)return;
  await endTurn('ai');
}

let calCur=null,calSel=null;
function eventsOn(d){
  const k=ymd(d),out=[];
  if(k===ymd(seoulNow()))out.push({t:'흑월 교전 대응',s:'종일 · 센터 작전과',c:'#ff453a'});
  if(d.getDay()===1)out.push({t:'작전과 주간 브리핑',s:'오전 9:00 · 본부 3층 상황실',c:'#0a84ff'});
  if(d.getDay()===3)out.push({t:'센터 정기 검진',s:'오후 3:00 · 의무실',c:'#30d158'});
  if(d.getDay()===5)out.push({t:'가이드부 합동 가이딩 훈련',s:'오후 7:00 · 차폐실 B',c:'#bf5af2'});
  if(d.getDate()===1||d.getDate()===15)out.push({t:'보급 정산일',s:'센터 보급과',c:'#ff9f0a'});
  (SAVE.cal&&SAVE.cal[k]||[]).forEach(t=>out.push({t,s:'작전 기록',c:'var(--acc)'}));
  return out;
}
function renderCal(){
  const now=seoulNow();
  if(!calCur)calCur=new Date(now.getFullYear(),now.getMonth(),1);
  if(!calSel)calSel=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const y=calCur.getFullYear(),m=calCur.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(new Date(y,m,d));while(cells.length%7)cells.push(null);
  const ev=eventsOn(calSel),tk=ymd(now);
  $('#calApp').innerHTML=`<div class="sb-sp"></div>
    <div class="calhd"><div><small>${y}년</small><h1>${m+1}월</h1></div>
      <div class="calnav"><button class="nbtn" data-cm="-1">${ico('back')}</button><button class="todayb" data-cm="0">오늘</button><button class="nbtn" data-cm="1">${ico('chev')}</button></div></div>
    <div class="wk">${[...DOW].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cg">${cells.map(d=>{if(!d)return '<div></div>';const k=ymd(d);
      const cls=[d.getDay()===0?'sun':d.getDay()===6?'sat':'',k===tk?'today':'',k===ymd(calSel)?'sel':''].join(' ');
      return `<button class="${cls}" data-d="${k}"><span>${d.getDate()}</span>${eventsOn(d).length?'<i></i>':''}</button>`}).join('')}</div>
    <div class="scroll evs"><div class="evh">${calSel.getMonth()+1}월 ${calSel.getDate()}일 ${DOW[calSel.getDay()]}요일${ymd(calSel)===tk?' · 오늘':''}</div>
      ${ev.length?ev.map(e=>`<div class="ev"><i style="background:${e.c}"></i><div><b>${e.t}</b><small>${e.s}</small></div></div>`).join(''):'<p class="note" style="padding:8px 2px">일정이 없어요</p>'}
      <div class="wsrc" style="color:var(--t3)">서울 표준시(KST) 기준 · 지금 ${now.getHours()<12?'오전':'오후'} ${now.getHours()%12||12}:${String(now.getMinutes()).padStart(2,'0')}</div></div>`;
  const A=$('#calApp');
  A.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{sfx('tap');const v=+b.dataset.cm;if(!v){calCur=null;calSel=null}else calCur=new Date(y,m+v,1);renderCal()});

let WX=null,WXt=0;
const WMO=c=>c===0?['맑음','☀️','🌙']:c<=2?['구름 조금','🌤️','☁️']:c===3?['흐림','☁️','☁️']:c<=48?['안개','🌫️','🌫️']:c<=57?['이슬비','🌦️','🌧️']:c<=67?['비','🌧️','🌧️']:c<=77?['눈','🌨️','🌨️']:c<=82?['소나기','🌦️','🌧️']:c<=86?['눈','❄️','❄️']:['뇌우','⛈️','⛈️'];
async function fetchWx(){
  const url='https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=7';
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),3500);
  try{
    const r=await fetch(url,{signal:ac.signal});clearTimeout(to);if(!r.ok)throw 0;const j=await r.json();
    const now=seoulNow(),cur=`${ymd(now)}T${String(now.getHours()).padStart(2,'0')}:00`;let hi=j.hourly.time.indexOf(cur);if(hi<0)hi=0;
    const hours=[];for(let i=hi;i<hi+12&&i<j.hourly.time.length;i++)hours.push({h:+j.hourly.time[i].slice(11,13),t:Math.round(j.hourly.temperature_2m[i]),code:j.hourly.weather_code[i]});
    const days=j.daily.time.map((t,i)=>{const[a,b,c]=t.split('-').map(Number);return{d:new Date(a,b-1,c),hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i]),code:j.daily.weather_code[i]}});
    const c=j.current;
    return{src:'live',cur:{t:Math.round(c.temperature_2m),feel:Math.round(c.apparent_temperature),hum:Math.round(c.relative_humidity_2m),wind:+(c.wind_speed_10m/3.6).toFixed(1),code:c.weather_code},hours,days};
  }catch(e){clearTimeout(to);return simWx()}
}
function simWx(){
  const N=[[2,-6],[5,-4],[11,1],[18,7],[24,13],[28,18],[29,22],[30,23],[26,18],[20,10],[12,3],[4,-4]];
  const rnd=s=>{const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x)};
  const key=d=>d.getFullYear()*1000+d.getMonth()*40+d.getDate();
  const day=d=>{const[h,l]=N[d.getMonth()],k=key(d),off=(rnd(k)-.5)*6,r=rnd(k+.37),cold=l+off<1;
    const code=r<.42?0:r<.62?2:r<.8?3:r<.92?(cold?71:61):45;
    return{d:new Date(d.getFullYear(),d.getMonth(),d.getDate()),hi:Math.round(h+off-(code>=61?2:0)),lo:Math.round(l+off),code}};
  const tAt=(d,h)=>{const x=day(d),f=(Math.cos((h-15)/24*2*Math.PI)+1)/2;return Math.round(x.lo+(x.hi-x.lo)*f+(rnd(key(d)*24+h)-.5))};
  const now=seoulNow(),today=day(now),hours=[],days=[];
  for(let i=0;i<12;i++){const t=new Date(now.getTime()+i*3600000);hours.push({h:t.getHours(),t:tAt(t,t.getHours()),code:day(t).code})}
  for(let i=0;i<7;i++)days.push(day(new Date(now.getFullYear(),now.getMonth(),now.getDate()+i)));
  const ct=tAt(now,now.getHours()),wind=+(1+rnd(key(now)+.9)*4).toFixed(1);
  return{src:'sim',cur:{t:ct,feel:Math.round(ct-wind*.8),hum:Math.round(40+rnd(key(now)+.5)*40),wind,code:today.code},hours,days};
}

  const gmin=Math.min(...w.days.map(d=>d.lo)),gmax=Math.max(...w.days.map(d=>d.hi)),sp=gmax-gmin||1;

  el.innerHTML=`<div class="sb-sp"></div><div class="wx">

const ATT_REWARDS=[
  {xp:30,t:'경험치 +30',e:'📋'},{card:'i_stab',t:'센티넬 안정제',e:'💊'},{xp:50,t:'경험치 +50',e:'📋'},

  {card:'i_bond',xp:100,t:'각인 승인서 + 경험치 100',e:'🏅'},
];
function attState(){SAVE.att=SAVE.att||{last:'',streak:0,best:0,total:0,days:{}};return SAVE.att}
const attToday=()=>attState().last===ymd(seoulNow());
function attStreakNow(){const a=attState(),y=new Date(seoulNow().getTime()-86400000);return a.last===ymd(seoulNow())||a.last===ymd(y)?a.streak:0}
function checkIn(){
  const a=attState(),today=ymd(seoulNow());if(a.last===today)return null;
  const y=ymd(new Date(seoulNow().getTime()-86400000));
  a.streak=a.last===y?a.streak+1:1;a.best=Math.max(a.best||0,a.streak);a.total=(a.total||0)+1;a.days[today]=1;a.last=today;
  const r=ATT_REWARDS[(a.streak-1)%7];
  if(r.xp)addXp(r.xp);
  SAVE.bonus=SAVE.bonus||{sp:0,cards:[]};if(r.card)SAVE.bonus.cards.push(r.card);if(r.sp)SAVE.bonus.sp=(SAVE.bonus.sp||0)+r.sp;
  save();progressCheck();propSig='';renderHome();return r;
}

    ${done?'<p class="att-note">오늘 출근 완료. 내일도 출근하면 다음 보상을 받아요.</p>':'<button class="cap pri wide att-go">출근 도장 찍기</button><p class="att-note">하루라도 빠지면 연속 출근이 1일차부터 다시 시작돼요.</p>'}

const charOf=k=>messageActor(k);
// 1) 유대 보너스(♥3)와 각성(이야기 6화 완료)
const BOND={
  doyun:{strain:-5,t:'공격 시 불안정도 -5'},seoha:{atk:150,t:'ATK +150'},ian:{atk:150,t:'ATK +150'},sein:{atk:150,t:'ATK +150'},
  taesik:{atk:200,t:'ATK +200'},yujin:{calm:10,t:'수류 진정 -25로 강화'},eunbyeol:{atk:150,t:'ATK +150'},dogyeom:{medic:100,t:'응급 처치 +100'},
  haeon:{power:5,t:'가이딩 +5'},roun:{power:5,t:'가이딩 +5'},
  jiho:{atk:150,t:'ATK +150'},rion:{atk:150,t:'ATK +150'},hana:{atk:100,t:'ATK +100'},mujin:{strain:-5,t:'공격 시 불안정도 -5'},dain:{power:5,t:'가이딩 +5'},ohwa:{power:5,t:'가이딩 +5'},
};
const BOND_AFF=3;
function bondLvOf(key){
  const c=charOf(key);if(!c||!BOND[c])return 0;
  if(((messengerState().arc[c]||{}).done||0)>=6)return 2;
  return (SAVE.aff[c]||0)>=BOND_AFF?1:0;
}
const bondLv=key=>G&&G.bonds&&key in G.bonds?G.bonds[key]:bondLvOf(key);
const perk=key=>{const c=charOf(key);return bondLv(key)>=1&&c&&BOND[c]||{}};
const awakeAtk=(key,type)=>bondLv(key)>=2?(type==='G'?200:300):0;
const awakePower=key=>bondLv(key)>=2?10:0;
function bondText(key){
  const c=charOf(key);if(!c||!BOND[c])return null;
  const lv=bondLvOf(key),a=SAVE.aff[c]||0,ad=((messengerState().arc[c]||{}).done)||0,isG=CARDS[key].type==='G';
  return{lv,perk:`♥${BOND_AFF} 유대: ${BOND[c].t}`,perkOn:lv>=1,perkSub:lv>=1?'적용 중':`친밀도 ${Math.min(a,BOND_AFF)}/${BOND_AFF}`,
    awake:`각성: ${isG?'가이딩 +10 · 현장 ATK +200':'ATK +300'}`,awakeOn:lv>=2,awakeSub:lv>=2?'각성 완료':`메신저 이야기 ${ad}/6화`};
}
// 2) 작전 효과 (답장 선택으로 등록, 다음 작전 1회 적용)
function addOpEff(eff,c){
  SAVE.nextOps=SAVE.nextOps||[];SAVE.nextOps.push({...eff,from:c});save();
  notify('다음 작전 효과 등록',escH(eff.label||'작전 효과'),'bond');
}
function opsSummary(list){return (list||[]).map(e=>e.label).filter(Boolean)}
function applyOps(){
  const L=SAVE.nextOps||[];G.ops=L;G.opsCard={};G.opsAll={inst:0,atk:0};G.opsWave={};SAVE.nextOps=[];
  let sp=0,lp=0,dr=0,pw={};
  for(const e of L){
    if(e.sp)sp+=e.sp;if(e.lp)lp+=e.lp;if(e.draw)dr+=e.draw;
    if(e.card){const o=G.opsCard[e.card]=G.opsCard[e.card]||{inst:0,atk:0,power:0};o.inst+=e.inst||0;o.atk+=e.atk||0;o.power+=e.power||0}
    if(e.all){G.opsAll.inst+=e.inst||0;G.opsAll.atk+=e.atk||0}
    if(e.wave){const o=G.opsWave[e.wave]=G.opsWave[e.wave]||{inst:0,atk:0};o.inst+=e.inst||0;o.atk+=e.atk||0}
  }
  if(sp)G.me.extraSp=(G.me.extraSp||0)+sp;
  if(lp){G.me.lp+=lp;G.me.maxLp+=lp}
  if(dr)draw('me',dr,null,true);
  if(L.length){log('me',`작전 효과 적용 — ${opsSummary(L).join(' / ')}`);setTimeout(()=>notify('작전 효과 적용',opsSummary(L).map(escH).join('<br>'),'bond'),2600)}
  save();
}
function opsOnDeploy(u){
  if(!G||!G.opsCard)return;
  const o=G.opsCard[u.key],w=u.card.type==='S'&&G.opsWave[u.card.wave];
  let di=0,da=0;
  if(o){di+=o.inst;da+=o.atk}
  if(u.card.type==='S'){di+=G.opsAll.inst;da+=G.opsAll.atk;if(w){di+=w.inst;da+=w.atk}}
  if(u.card.type==='S'&&di)u.inst=Math.max(0,Math.min(95,u.inst+di));
  if(da)u.atkMod+=da;
}
const opsPower=key=>G&&G.opsCard&&G.opsCard[key]?G.opsCard[key].power||0:0;
